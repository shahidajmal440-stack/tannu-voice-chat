<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Tannu Voice Room</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      background: linear-gradient(145deg, #120b24, #291052, #081525);
      color: white;
    }

    .room {
      max-width: 430px;
      min-height: 100vh;
      margin: auto;
      padding: 18px;
    }

    .top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 25px;
    }

    .back {
      border: 0;
      background: rgba(255,255,255,0.1);
      color: white;
      width: 42px;
      height: 42px;
      border-radius: 50%;
      font-size: 22px;
    }

    .title {
      text-align: center;
    }

    .title h1 {
      font-size: 20px;
    }

    .live {
      color: #65ffb0;
      font-size: 12px;
    }

    .room-box {
      background: rgba(255,255,255,0.08);
      border-radius: 24px;
      padding: 28px 15px;
      text-align: center;
    }

    .host {
      color: #ff9bd2;
      font-size: 12px;
      margin-bottom: 12px;
    }

    .avatar {
      width: 80px;
      height: 80px;
      margin: auto;
      border-radius: 50%;
      background: linear-gradient(135deg, #ff4da6, #8b5cf6);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 34px;
      font-weight: bold;
    }

    .room-box h2 {
      margin-top: 14px;
    }

    .room-box p {
      color: #c7bfd4;
      margin-top: 7px;
      font-size: 14px;
    }

    .status {
      margin-top: 15px;
      color: #65ffb0;
      font-size: 13px;
    }

    .people {
      display: flex;
      justify-content: center;
      gap: 16px;
      margin-top: 28px;
      flex-wrap: wrap;
    }

    .person {
      font-size: 11px;
      color: #cfc8d8;
      text-align: center;
    }

    .mini {
      width: 52px;
      height: 52px;
      border-radius: 50%;
      background: #45305f;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 5px;
      font-size: 20px;
    }

    .controls {
      display: flex;
      justify-content: center;
      gap: 18px;
      margin-top: 40px;
    }

    .control {
      width: 68px;
      height: 68px;
      border: 0;
      border-radius: 50%;
      background: rgba(255,255,255,0.12);
      color: white;
      font-size: 25px;
    }

    .control span {
      display: block;
      font-size: 10px;
      margin-top: 3px;
    }

    .leave {
      background: #e83d5b;
    }

    .off {
      background: #555;
    }

    #remoteAudio {
      display: none;
    }
  </style>
</head>

<body>

  <div class="room">

    <div class="top">

      <button class="back" onclick="goBack()">←</button>

      <div class="title">
        <h1 id="roomName">Loading...</h1>
      </div>

      <div class="live" id="roomStatus">
        ● LIVE
      </div>

    </div>

    <div class="room-box">

      <div class="host" id="roomHost">
        ROOM HOST
      </div>

      <div class="avatar">
        T
      </div>

      <h2 id="roomTitle">
        Loading...
      </h2>

      <p id="roomUsers">
        Loading room data...
      </p>

      <div class="status" id="voiceStatus">
        Connecting voice...
      </div>

      <div class="people">

        <div class="person">
          <div class="mini">A</div>
          Ali
        </div>

        <div class="person">
          <div class="mini">S</div>
          Sameer
        </div>

        <div class="person">
          <div class="mini">R</div>
          Rahul
        </div>

        <div class="person">
          <div class="mini">N</div>
          Neha
        </div>

      </div>

    </div>

    <div class="controls">

      <button
        id="mic"
        class="control"
        onclick="toggleMic()">

        🎙️

        <span id="micText">
          Mic
        </span>

      </button>

      <button
        id="speakerButton"
        class="control"
        onclick="speaker()">

        🔊

        <span>
          Speaker
        </span>

      </button>

      <button
        class="control leave"
        onclick="leaveRoom()">

        📞

        <span>
          Leave
        </span>

      </button>

    </div>

  </div>

  <audio id="remoteAudio" autoplay playsinline></audio>


  <!-- FIREBASE -->

  <script type="module">

    import {
      initializeApp
    } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";

    import {
      getAuth,
      onAuthStateChanged
    } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";

    import {
      getFirestore,
      collection,
      getDocs,
      doc,
      getDoc,
      setDoc,
      updateDoc,
      onSnapshot,
      addDoc,
      serverTimestamp,
      runTransaction
    } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";


    const firebaseConfig = {

      apiKey: "AIzaSyAc7BBnG5zzAmB4Mx-3haVwE0aob5HlVc",

      authDomain: "tannu-voice-chat.firebaseapp.com",

      projectId: "tannu-voice-chat",

      storageBucket: "tannu-voice-chat.firebasestorage.app",

      messagingSenderId: "720483733073",

      appId: "1:720483733073:web:c65b96d255d6177b9d7270"

    };


    const app = initializeApp(firebaseConfig);

    const auth = getAuth(app);

    const db = getFirestore(app);


    let stream = null;
    let peer = null;
    let roomId = null;
    let userId = null;
    let muted = false;
    let isCaller = false;
    let callerUnsubscribe = null;
    let answerUnsubscribe = null;
    let candidateUnsubscribe = null;


    const remoteAudio =
      document.getElementById("remoteAudio");


    const voiceStatus =
      document.getElementById("voiceStatus");


    // GET ROOM ID

    const params = new URLSearchParams(
      window.location.search
    );

    roomId = params.get("room");


    if (!roomId) {

      voiceStatus.innerText =
        "Room ID missing ❌";

    }


    // LOAD ROOM

    async function loadRooms() {

      try {

        const roomsRef =
          collection(db, "rooms");

        const snapshot =
          await getDocs(roomsRef);


        snapshot.forEach((docSnap) => {

          if (docSnap.id !== roomId && roomId) {
            return;
          }

          const room = docSnap.data();


          document.getElementById("roomName").innerText =
            room.name || "Tannu Voice Room";


          document.getElementById("roomTitle").innerText =
            (room.name || "Tannu Friends") + " 🎙️";


          document.getElementById("roomHost").innerText =
            "HOST: " + (room.host || "Tannu");


          document.getElementById("roomStatus").innerText =
            "● " +
            (room.status || "LIVE").toUpperCase();


          document.getElementById("roomUsers").innerText =
            "👥 " +
            (room.users || 0) +
            " Users";

        });


      } catch (error) {

        console.error(error);

        document.getElementById("roomUsers").innerText =
          "Room data loading error ❌";

      }

    }


    loadRooms();


    // AUTH

    onAuthStateChanged(auth, async (user) => {

      if (!user) {

        voiceStatus.innerText =
          "Please login first ❌";

        return;
      }


      userId = user.uid;

      console.log("Logged in:", userId);

      await startVoice();

    });


    // CREATE WEBRTC

    async function createPeer() {

      peer = new RTCPeerConnection({

        iceServers: [

          {
            urls: "stun:stun.l.google.com:19302"
          },

          {
            urls: "stun:stun1.l.google.com:19302"
          }

        ]

      });


      peer.onicecandidate = async (event) => {

        if (!event.candidate || !roomId) {
          return;
        }


        try {

          await addDoc(

            collection(
              db,
              "voiceRooms",
              roomId,
              "candidates"
            ),

            {

              candidate:
                event.candidate.toJSON(),

              userId: userId,

              createdAt:
                serverTimestamp()

            }

          );

        } catch (error) {

          console.error(
            "Candidate error:",
            error
          );

        }

      };


      peer.ontrack = (event) => {

        console.log("Remote audio received");

        remoteAudio.srcObject =
          event.streams[0];

        remoteAudio.play().catch(() => {});

        voiceStatus.innerText =
          "🟢 Voice connected";

      };


      peer.onconnectionstatechange = () => {

        console.log(
          "Connection:",
          peer.connectionState
        );


        if (
          peer.connectionState ===
          "connected"
        ) {

          voiceStatus.innerText =
            "🟢 Voice connected";

        }


        if (
          peer.connectionState ===
          "disconnected" ||
          peer.connectionState ===
          "failed"
        ) {

          voiceStatus.innerText =
            "Voice disconnected ❌";

        }

      };


      if (stream) {

        stream
          .getTracks()
          .forEach(track => {

            peer.addTrack(
              track,
              stream
            );

          });

      }

    }


    // START VOICE

    async function startVoice() {

      try {

        voiceStatus.innerText =
          "🎤 Requesting microphone...";


        stream =
          await navigator.mediaDevices
            .getUserMedia({
              audio: true
            });


        console.log(
          "Microphone ready"
        );


        document.getElementById(
          "micText"
        ).innerText = "Mute";


        await createPeer();


        const roomRef =
          doc(
            db,
            "voiceRooms",
            roomId
          );


        // FIRST USER BECOMES CALLER

        await runTransaction(
          db,
          async (transaction) => {

            const snap =
              await transaction.get(
                roomRef
              );


            if (!snap.exists()) {

              transaction.set(
                roomRef,
                {
                  callerId: userId,
                  createdAt:
                    serverTimestamp()
                }
              );

              isCaller = true;

            } else {

              const data =
                snap.data();

              if (
                data.callerId ===
                userId
              ) {

                isCaller = true;

              } else {

                isCaller = false;

              }

            }

          }
        );


        if (isCaller) {

          await createOffer();

        } else {

          await listenForOffer();

        }


      } catch (error) {

        console.error(
          "Voice error:",
          error
        );


        voiceStatus.innerText =
          "Microphone error ❌";


        alert(
          "Microphone/voice error: " +
          error.message
        );

      }

    }


    // CALLER CREATES OFFER

    async function createOffer() {

      voiceStatus.innerText =
        "Waiting for another user...";


      const offer =
        await peer.createOffer();


      await peer.setLocalDescription(
        offer
      );


      const roomRef =
        doc(
          db,
          "voiceRooms",
          roomId
        );


      await updateDoc(
        roomRef,
        {
          offer: {
            type: offer.type,
            sdp: offer.sdp
          }
        }
      );


      answerUnsubscribe =
        onSnapshot(
          roomRef,
          async (snapshot) => {

            const data =
              snapshot.data();


            if (
              !data ||
              !data.answer
            ) {

              return;

            }


            if (
              peer.currentRemoteDescription
            ) {

              return;

            }


            await peer.setRemoteDescription(
              new RTCSessionDescription(
                data.answer
              )
            );


            voiceStatus.innerText =
              "🔗 Connecting voice...";

          }
        );


      listenForCandidates();

    }


    // SECOND USER LISTENS FOR OFFER

    async function listenForOffer() {

      voiceStatus.innerText =
        "Joining voice room...";


      const roomRef =
        doc(
          db,
          "voiceRooms",
          roomId
        );


      callerUnsubscribe =
        onSnapshot(
          roomRef,
          async (snapshot) => {

            const data =
              snapshot.data();


            if (
              !data ||
              !data.offer
            ) {

              return;

            }


            if (
              peer.currentRemoteDescription
            ) {

              return;

            }


            await peer.setRemoteDescription(

              new RTCSessionDescription(
                data.offer
              )

            );


            const answer =
              await peer.createAnswer();


            await peer.setLocalDescription(
              answer
            );


            await updateDoc(
              roomRef,
              {
                answer: {
                  type: answer.type,
                  sdp: answer.sdp
                }
              }
            );


            voiceStatus.innerText =
              "🔗 Connecting voice...";

          }
        );


      listenForCandidates();

    }


    // ICE CANDIDATES

    function listenForCandidates() {

      candidateUnsubscribe =
        onSnapshot(

          collection(
            db,
            "voiceRooms",
            roomId,
            "candidates"
          ),

          async (snapshot) => {

            for (
              const change of
              snapshot.docChanges()
            ) {

              if (
                change.type !==
                "added"
              ) {

                continue;

              }


              const data =
                change.doc.data();


              if (
                data.userId ===
                userId
              ) {

                continue;

              }


              if (!peer) {
                continue;
              }


              try {

                await peer.addIceCandidate(

                  new RTCIceCandidate(
                    data.candidate
                  )

                );

              } catch (error) {

                console.error(
                  "ICE error:",
                  error
                );

              }

            }

          }

        );

    }


    // MIC

    window.toggleMic = function() {

      if (!stream) {

        alert(
          "Microphone is not ready yet."
        );

        return;

      }


      muted = !muted;


      stream
        .getAudioTracks()
        .forEach(track => {

          track.enabled =
            !muted;

        });


      const mic =
        document.getElementById(
          "mic"
        );

      const text =
        document.getElementById(
          "micText"
        );


      if (muted) {

        mic.classList.add(
          "off"
        );

        text.innerText =
          "Unmute";

      } else {

        mic.classList.remove(
          "off"
        );

        text.innerText =
          "Mute";

      }

    };


    // SPEAKER

    window.speaker = function() {

      if (
        remoteAudio
      ) {

        remoteAudio.muted =
          !remoteAudio.muted;

        voiceStatus.innerText =
          remoteAudio.muted
            ? "🔇 Speaker muted"
            : "🔊 Speaker ON";

      }

    };


    // LEAVE

    window.leaveRoom = function() {

      cleanup();

      window.location.href =
        "index.html";

    };


    window.goBack = function() {

      cleanup();

      window.location.href =
        "index.html";

    };


    function cleanup() {

      if (callerUnsubscribe) {
        callerUnsubscribe();
      }

      if (answerUnsubscribe) {
        answerUnsubscribe();
      }

      if (candidateUnsubscribe) {
        candidateUnsubscribe();
      }


      if (stream) {

        stream
          .getTracks()
          .forEach(track => {
            track.stop();
          });

      }


      if (peer) {

        peer.close();

      }

    }

  </script>

</body>

</html>
