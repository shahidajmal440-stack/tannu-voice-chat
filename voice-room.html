<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tannu Auth Test</title>
</head>

<body style="background:#17102b;color:white;font-family:Arial;padding:30px">

  <h2>Tannu Voice Chat</h2>

  <p id="status">Checking login...</p>

  <button id="mic" style="padding:15px;font-size:18px">
    🎙️ Test Microphone
  </button>

  <script type="module">

    import { initializeApp }
      from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";

    import {
      getAuth,
      onAuthStateChanged
    } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";


    const firebaseConfig = {

      apiKey: "AIzaSyAc7BBn6G5zzAmB4Mx-3haVwE0aob5HlVc",

      authDomain: "tannu-voice-chat.firebaseapp.com",

      projectId: "tannu-voice-chat",

      storageBucket: "tannu-voice-chat.firebasestorage.app",

      messagingSenderId: "720483733073",

      appId: "1:720483733073:web:c65b96d255d6177b9d7270"

    };


    const app =
      initializeApp(firebaseConfig);

    const auth =
      getAuth(app);


    const status =
      document.getElementById("status");


    onAuthStateChanged(
      auth,
      (user) => {

        if (user) {

          status.innerText =
            "✅ LOGIN FOUND\n\n" +
            "Name: " +
            (user.displayName || "User") +
            "\n\nUID: " +
            user.uid;

        } else {

          status.innerText =
            "❌ NO LOGIN FOUND";

        }

      }
    );


    document
      .getElementById("mic")
      .onclick = async () => {

        try {

          const stream =
            await navigator.mediaDevices
              .getUserMedia({
                audio: true
              });

          status.innerText =
            "🎤 MICROPHONE WORKING ✅";

          stream
            .getTracks()
            .forEach(
              track => track.stop()
            );

        } catch (error) {

          status.innerText =
            "❌ MIC ERROR\n\n" +
            error.name +
            "\n\n" +
            error.message;

        }

      };

  </script>

</body>
</html>
