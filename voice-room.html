<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Tannu Friends</title>

  <style>
    body {
      margin: 0;
      background: #17102b;
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
    }

    .room {
      padding: 25px 15px;
    }

    h1 {
      margin-bottom: 5px;
    }

    .live {
      color: #ff4d6d;
      font-weight: bold;
    }

    .host {
      margin: 10px 0 25px;
    }

    .users {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      max-width: 500px;
      margin: auto;
    }

    .user {
      background: #281c46;
      border-radius: 15px;
      padding: 18px 5px;
    }

    .avatar {
      width: 55px;
      height: 55px;
      background: #6c4cff;
      border-radius: 50%;
      margin: auto;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      font-weight: bold;
    }

    .controls {
      margin-top: 35px;
    }

    button {
      border: 0;
      border-radius: 12px;
      padding: 14px 20px;
      margin: 5px;
      font-size: 16px;
      font-weight: bold;
    }

    #mic {
      background: #555;
      color: white;
    }

    #speaker {
      background: #20b765;
      color: white;
    }

    #leave {
      background: #e5484d;
      color: white;
    }

    #status {
      margin: 20px auto;
      max-width: 500px;
      padding: 14px;
      border-radius: 10px;
      background: #211638;
      font-size: 14px;
      white-space: pre-line;
    }

    audio {
      display: none;
    }
  </style>
</head>

<body>

<div class="room">

  <h1>🎙️ Tannu Friends</h1>

  <div class="live">● LIVE</div>

  <div class="host">
    HOST: <b>Tannu</b>
  </div>

  <div class="users">

    <div class="user">
      <div class="avatar">T</div>
      <p>Tannu</p>
    </div>

    <div class="user">
      <div class="avatar">S</div>
      <p>Sameer</p>
    </div>

    <div class="user">
      <div class="avatar">R</div>
      <p>Rahul</p>
    </div>

    <div class="user">
      <div class="avatar">A</div>
      <p>Ali</p>
    </div>

    <div class="user">
      <div class="avatar">N</div>
      <p>Neha</p>
    </div>

    <div class="user">
      <div class="avatar">+</div>
      <p>Empty Seat</p>
    </div>

  </div>

  <div id="status">
    Checking login...
  </div>

  <div class="controls">

    <button id="mic">
      🎙️ Mic OFF
    </button>

    <button id="speaker">
      🔊 Speaker ON
    </button>

    <button id="leave">
      🚪 Leave
    </button>

  </div>

  <audio id="remoteAudio" autoplay playsinline></audio>

</div>


<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";

import {
  getAuth,
  onAuthStateChanged
}
from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";

import {
  getFirestore,
  doc,
  getDoc,
  setDoc,
  onSnapshot,
  collection,
  addDoc
}
from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";


/* =========================
   FIREBASE
========================= */

const firebaseConfig = {

  apiKey:
    "AIzaSyAc7BBn6G5zzAmB4Mx-3haVwE0aob5HlVc",

  authDomain:
    "tannu-voice-chat.firebaseapp.com",

  projectId:
    "tannu-voice-chat",

  storageBucket:
    "tannu-voice-chat.firebasestorage.app",

  messagingSenderId:
    "720483733073",

  appId:
    "1:720483733073:web:c65b96d255d6177b9d7270"

};


const app = initializeApp(firebaseConfig);

const auth = getAuth(app);

const db = getFirestore(app);


/* =========================
   UI
========================= */

const status =
  document.getElementById("status");

const micButton =
  document.getElementById("mic");

const speakerButton =
  document.getElementById("speaker");

const leaveButton =
  document.getElementById("leave");

const remoteAudio =
  document.getElementById("remoteAudio");


/* =========================
   VARIABLES
========================= */

let currentUser = null;

let localStream = null;

let peer = null;

let micOn = false;

let speakerOn = true;

let remoteDescriptionReady = false;

let pendingCandidates = [];


/* =========================
   ROOM
========================= */

const params =
  new URLSearchParams(location.search);

const roomId =
  params.get("room") || "test-room";


/*
  Every page load gets a unique
  session ID.

  This prevents old test data
  from being reused inside the
  same voice room.
*/

const sessionId =
  crypto.randomUUID();


/* =========================
   LOGIN
========================= */

onAuthStateChanged(
  auth,
  async (user) => {

    if (!user) {

      currentUser = null;

      status.innerText =
        "❌ Please login first.";

      return;
    }

    currentUser = user;

    status.innerText =
      "✅ Login found\n\n" +
      "Welcome " +
      (user.displayName || "User") +
      "\n\n" +
      "🎙️ Press Mic to join voice.";

  }
);


/* =========================
   MICROPHONE
========================= */

async function startMicrophone() {

  try {

    if (!navigator.mediaDevices ||
        !navigator.mediaDevices.getUserMedia) {

      throw new Error(
        "Microphone is not supported."
      );

    }


    localStream =
      await navigator.mediaDevices.getUserMedia({

        audio: {

          echoCancellation: true,

          noiseSuppression: true,

          autoGainControl: true

        },

        video: false

      });


    micOn = true;


    micButton.innerText =
      "🎙️ Mic ON";

    micButton.style.background =
      "#20b765";


    status.innerText =
      "🎙️ Microphone ON\n\n" +
      "Connecting voice...";


    await startVoiceConnection();


  } catch (error) {

    console.error(error);

    status.innerText =
      "❌ Microphone error\n\n" +
      error.name +
      "\n" +
      error.message;

  }

}


/* =========================
   ADD QUEUED ICE
========================= */

async function flushCandidates() {

  if (!peer) return;

  if (!remoteDescriptionReady) return;


  while (
    pendingCandidates.length > 0
  ) {

    const candidate =
      pendingCandidates.shift();


    try {

      await peer.addIceCandidate(
        candidate
      );

    } catch (error) {

      console.log(
        "Queued ICE error:",
        error
      );

    }

  }

}


/* =========================
   ADD REMOTE ICE
========================= */

async function addRemoteCandidate(
  data
) {

  if (!peer) return;


  const candidate =
    new RTCIceCandidate(data);


  if (!remoteDescriptionReady) {

    pendingCandidates.push(
      candidate
    );

    return;

  }


  try {

    await peer.addIceCandidate(
      candidate
    );

  } catch (error) {

    console.log(
      "ICE candidate error:",
      error
    );

  }

}


/* =========================
   WEBRTC
========================= */

async function startVoiceConnection() {

  if (!currentUser) {

    status.innerText =
      "❌ Login not found.";

    return;

  }


  /* =========================
     PEER
  ========================= */

  peer =
    new RTCPeerConnection({

      iceServers: [

        {
          urls:
            "stun:stun.l.google.com:19302"
        },

        {
          urls:
            "stun:stun1.l.google.com:19302"
        },

        {
          urls:
            "stun:stun2.l.google.com:19302"
        }

      ]

    });


  /* =========================
     LOCAL AUDIO
  ========================= */

  localStream
    .getTracks()
    .forEach(track => {

      peer.addTrack(
        track,
        localStream
      );

    });


  /* =========================
     REMOTE AUDIO
  ========================= */

  peer.ontrack =
    event => {

      console.log(
        "REMOTE AUDIO RECEIVED"
      );


      if (
        event.streams &&
        event.streams[0]
      ) {

        remoteAudio.srcObject =
          event.streams[0];

      }


      remoteAudio.muted =
        !speakerOn;


      remoteAudio
        .play()
        .catch(error => {

          console.log(
            "Audio play:",
            error
          );

        });

    };


  /* =========================
     CONNECTION STATE
  ========================= */

  peer.onconnectionstatechange =
    () => {

      console.log(
        "Connection:",
        peer.connectionState
      );


      if (
        peer.connectionState ===
        "connected"
      ) {

        status.innerText =
          "🟢 VOICE CONNECTED\n\n" +
          "Real voice connection active.";

      }


      else if (
        peer.connectionState ===
        "connecting"
      ) {

        status.innerText =
          "🟡 Connecting voice...";

      }


      else if (
        peer.connectionState ===
        "failed"
      ) {

        status.innerText =
          "🔴 Voice connection failed.\n\n" +
          "Internet/NAT connection problem.";

      }


      else if (
        peer.connectionState ===
        "disconnected"
      ) {

        status.innerText =
          "🟠 Voice disconnected.";

      }

    };


  /* =========================
     ICE STATE
  ========================= */

  peer.oniceconnectionstatechange =
    () => {

      console.log(
        "ICE:",
        peer.iceConnectionState
      );

    };


  /* =========================
     ROOM REFERENCES
  ========================= */

  const roomRef =
    doc(
      db,
      "voiceRooms",
      roomId
    );


  const callerCandidates =
    collection(
      roomRef,
      "callerCandidates"
    );


  const calleeCandidates =
    collection(
      roomRef,
      "calleeCandidates"
    );


  /* =========================
     CHECK ROOM
  ========================= */

  const roomSnapshot =
    await getDoc(roomRef);


  /* =========================
     FIRST PHONE
     CALLER
  ========================= */

  if (!roomSnapshot.exists()) {

    console.log(
      "ROLE: CALLER"
    );


    /*
      IMPORTANT:
      ICE handler is attached
      BEFORE setLocalDescription.
    */

    peer.onicecandidate =
      async event => {

        if (
          !event.candidate
        ) return;


        try {

          await addDoc(
            callerCandidates,

            {
              candidate:
                event.candidate
                  .candidate,

              sdpMid:
                event.candidate
                  .sdpMid,

              sdpMLineIndex:
                event.candidate
                  .sdpMLineIndex
            }

          );

        } catch (error) {

          console.log(
            "Caller ICE save error:",
            error
          );

        }

      };


    /* CREATE OFFER */

    const offer =
      await peer.createOffer();


    await peer.setLocalDescription(
      offer
    );


    /* SAVE OFFER */

    await setDoc(
      roomRef,

      {

        sessionId:
          sessionId,

        offer: {

          type:
            offer.type,

          sdp:
            offer.sdp

        }

      },

      {
        merge: false
      }

    );


    status.innerText =
      "📞 Waiting for friend...\n\n" +
      "Share the same room link.";

    
    /* =========================
       LISTEN FOR ANSWER
    ========================= */

    onSnapshot(
      roomRef,

      async snapshot => {

        const data =
          snapshot.data();

        if (!data) return;


        if (
          data.sessionId !==
          sessionId
        ) {

          return;

        }


        if (
          data.answer &&
          !peer.currentRemoteDescription
        ) {

          console.log(
            "ANSWER RECEIVED"
          );


          await peer.setRemoteDescription(

            new RTCSessionDescription(
              data.answer
            )

          );


          remoteDescriptionReady =
            true;


          await flushCandidates();

        }

      },

      error => {

        console.log(
          "Room listener error:",
          error
        );

      }

    );


    /* =========================
       LISTEN CALLEE ICE
    ========================= */

    onSnapshot(
      calleeCandidates,

      snapshot => {

        snapshot.docChanges()
          .forEach(change => {

            if (
              change.type !==
              "added"
            ) return;


            const data =
              change.doc.data();


            addRemoteCandidate({

              candidate:
                data.candidate,

              sdpMid:
                data.sdpMid,

              sdpMLineIndex:
                data.sdpMLineIndex

            });

          });

      },

      error => {

        console.log(
          "Callee ICE listener error:",
          error
        );

      }

    );

  }


  /* =========================
     SECOND PHONE
     ANSWERER
  ========================= */

  else {

    console.log(
      "ROLE: ANSWERER"
    );


    const data =
      roomSnapshot.data();


    if (!data.offer) {

      status.innerText =
        "❌ No offer found.";

      return;

    }


    /*
      Receive caller ICE
    */

    onSnapshot(
      callerCandidates,

      snapshot => {

        snapshot.docChanges()
          .forEach(change => {

            if (
              change.type !==
              "added"
            ) return;


            const data =
              change.doc.data();


            addRemoteCandidate({

              candidate:
                data.candidate,

              sdpMid:
                data.sdpMid,

              sdpMLineIndex:
                data.sdpMLineIndex

            });

          });

      },

      error => {

        console.log(
          "Caller ICE listener error:",
          error
        );

      }

    );


    /*
      Set remote offer
    */

    await peer.setRemoteDescription(

      new RTCSessionDescription(
        data.offer
      )

    );


    remoteDescriptionReady =
      true;


    await flushCandidates();


    /*
      IMPORTANT:
      ICE handler before
      setLocalDescription.
    */

    peer.onicecandidate =
      async event => {

        if (
          !event.candidate
        ) return;


        try {

          await addDoc(
            calleeCandidates,

            {

              candidate:
                event.candidate
                  .candidate,

              sdpMid:
                event.candidate
                  .sdpMid,

              sdpMLineIndex:
                event.candidate
                  .sdpMLineIndex

            }

          );

        } catch (error) {

          console.log(
            "Callee ICE save error:",
            error
          );

        }

      };


    /* CREATE ANSWER */

    const answer =
      await peer.createAnswer();


    await peer.setLocalDescription(
      answer
    );


    /* SAVE ANSWER */

    await setDoc(

      roomRef,

      {

        answer: {

          type:
            answer.type,

          sdp:
            answer.sdp

        }

      },

      {
        merge: true
      }

    );


    status.innerText =
      "🟡 Answer sent.\n\n" +
      "Connecting voice...";

  }

}


/* =========================
   MIC BUTTON
========================= */

micButton.onclick =
  async () => {

    if (!localStream) {

      await startMicrophone();

      return;

    }


    micOn =
      !micOn;


    localStream
      .getAudioTracks()
      .forEach(track => {

        track.enabled =
          micOn;

      });


    if (micOn) {

      micButton.innerText =
        "🎙️ Mic ON";

      micButton.style.background =
        "#20b765";

    } else {

      micButton.innerText =
        "🔇 Mic OFF";

      micButton.style.background =
        "#555";

    }

  };


/* =========================
   SPEAKER
========================= */

speakerButton.onclick =
  () => {

    speakerOn =
      !speakerOn;


    remoteAudio.muted =
      !speakerOn;


    if (speakerOn) {

      speakerButton.innerText =
        "🔊 Speaker ON";

      speakerButton.style.background =
        "#20b765";


      remoteAudio
        .play()
        .catch(() => {});

    } else {

      speakerButton.innerText =
        "🔇 Speaker OFF";

      speakerButton.style.background =
        "#555";

    }

  };


/* =========================
   LEAVE
========================= */

leaveButton.onclick =
  () => {

    if (localStream) {

      localStream
        .getTracks()
        .forEach(track =>
          track.stop()
        );

    }


    if (peer) {

      peer.close();

    }


    window.location.href =
      "index.html";

  };

</script>

</body>
</html>
