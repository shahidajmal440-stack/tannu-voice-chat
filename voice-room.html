<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tannu Friends</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #17102b;
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
    }

    .room {
      padding: 25px 15px 40px;
    }

    h1 {
      margin-bottom: 5px;
    }

    .live {
      color: #ff4d6d;
      font-weight: bold;
    }

    .host {
      margin: 10px 0 25px;
    }

    .users {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      max-width: 500px;
      margin: auto;
    }

    .user {
      background: #281c46;
      border-radius: 15px;
      padding: 18px 5px;
    }

    .avatar {
      width: 55px;
      height: 55px;
      background: #6c4cff;
      border-radius: 50%;
      margin: auto;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      font-weight: bold;
    }

    .controls {
      margin-top: 25px;
    }

    button {
      border: 0;
      border-radius: 12px;
      padding: 14px 20px;
      margin: 5px;
      font-size: 16px;
      font-weight: bold;
    }

    #mic {
      background: #555;
      color: white;
    }

    #speaker {
      background: #20b765;
      color: white;
    }

    #leave {
      background: #e5484d;
      color: white;
    }

    #status {
      margin: 20px auto;
      max-width: 500px;
      padding: 14px;
      border-radius: 10px;
      background: #211638;
      font-size: 14px;
      white-space: pre-line;
      line-height: 1.5;
    }

    #remoteAudio {
      width: 90%;
      max-width: 400px;
      margin-top: 10px;
    }

    .hidden {
      display: none;
    }
  </style>
</head>

<body>

<div class="room">

  <h1>🎙️ Tannu Friends</h1>

  <div class="live">● LIVE</div>

  <div class="host">
    HOST: <b>Tannu</b>
  </div>

  <div class="users">

    <div class="user">
      <div class="avatar">T</div>
      <p>Tannu</p>
    </div>

    <div class="user">
      <div class="avatar">S</div>
      <p>Sameer</p>
    </div>

    <div class="user">
      <div class="avatar">R</div>
      <p>Rahul</p>
    </div>

    <div class="user">
      <div class="avatar">A</div>
      <p>Ali</p>
    </div>

    <div class="user">
      <div class="avatar">N</div>
      <p>Neha</p>
    </div>

    <div class="user">
      <div class="avatar">+</div>
      <p>Empty Seat</p>
    </div>

  </div>

  <div id="status">
    Checking login...
  </div>

  <div class="controls">

    <button id="mic">
      🎙️ Mic OFF
    </button>

    <button id="speaker">
      🔊 Speaker ON
    </button>

    <button id="leave">
      🚪 Leave
    </button>

  </div>

  <audio
    id="remoteAudio"
    autoplay
    playsinline
    controls>
  </audio>

</div>


<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";

import {
  getAuth,
  onAuthStateChanged
}
from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";

import {
  getFirestore,
  doc,
  getDoc,
  setDoc,
  updateDoc,
  onSnapshot
}
from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";


/* ================= FIREBASE ================= */

const firebaseConfig = {

  apiKey:
    "AIzaSyAc7BBn6G5zzAmB4Mx-3haVwE0aob5HlVc",

  authDomain:
    "tannu-voice-chat.firebaseapp.com",

  projectId:
    "tannu-voice-chat",

  storageBucket:
    "tannu-voice-chat.firebasestorage.app",

  messagingSenderId:
    "720483733073",

  appId:
    "1:720483733073:web:c65b96d255d6177b9d7270"

};


const app =
  initializeApp(firebaseConfig);

const auth =
  getAuth(app);

const db =
  getFirestore(app);


/* ================= ELEMENTS ================= */

const status =
  document.getElementById("status");

const micButton =
  document.getElementById("mic");

const speakerButton =
  document.getElementById("speaker");

const leaveButton =
  document.getElementById("leave");

const remoteAudio =
  document.getElementById("remoteAudio");


/* ================= VARIABLES ================= */

let currentUser = null;

let localStream = null;

let peer = null;

let micOn = false;

let speakerOn = true;

let isCaller = false;

let remoteDescriptionSet = false;

let pendingRemoteCandidates = [];

let stopRoomListener = null;

let connectionTimer = null;

let leaving = false;


/* ================= ROOM ================= */

const params =
  new URLSearchParams(location.search);

const roomId =
  params.get("room") || "test-room";

const roomRef =
  doc(
    db,
    "voiceRooms",
    roomId
  );


/* ================= STATUS ================= */

function showStatus(text) {

  status.innerText = text;

  console.log(
    "[TANNU]",
    text
  );

}


/* ================= LOGIN ================= */

onAuthStateChanged(
  auth,
  async user => {

    if (!user) {

      currentUser = null;

      showStatus(
        "❌ Please login first."
      );

      return;
    }

    currentUser = user;

    showStatus(
      "✅ Login found\n\n" +
      "Welcome " +
      (user.displayName || "User") +
      "\n\n" +
      "🎙️ Press Mic to join voice."
    );

  }
);


/* ================= MICROPHONE ================= */

async function startMicrophone() {

  try {

    if (!currentUser) {

      showStatus(
        "❌ Please login first."
      );

      return;
    }


    if (
      !navigator.mediaDevices ||
      !navigator.mediaDevices.getUserMedia
    ) {

      throw new Error(
        "Microphone is not supported by this browser."
      );

    }


    localStream =
      await navigator.mediaDevices
        .getUserMedia({

          audio: {

            echoCancellation: true,

            noiseSuppression: true,

            autoGainControl: true

          },

          video: false

        });


    micOn = true;

    micButton.innerText =
      "🎙️ Mic ON";

    micButton.style.background =
      "#20b765";


    showStatus(
      "🎙️ Microphone ON\n\n" +
      "Joining voice room..."
    );


    await startVoiceConnection();

  }

  catch (error) {

    console.error(
      "MIC ERROR:",
      error
    );

    showStatus(
      "❌ Microphone error\n\n" +
      error.name +
      "\n" +
      error.message
    );

  }

}


/* ================= WAIT FOR ICE ================= */

function waitForIceGatheringComplete() {

  return new Promise(resolve => {

    if (!peer) {

      resolve();

      return;

    }


    if (
      peer.iceGatheringState ===
      "complete"
    ) {

      resolve();

      return;

    }


    const timeout =
      setTimeout(
        () => {

          console.log(
            "⚠️ ICE gathering timeout"
          );

          resolve();

        },
        10000
      );


    const check =
      () => {

        if (
          peer.iceGatheringState ===
          "complete"
        ) {

          clearTimeout(timeout);

          peer.removeEventListener(
            "icegatheringstatechange",
            check
          );

          resolve();

        }

      };


    peer.addEventListener(
      "icegatheringstatechange",
      check
    );

  });

}


/* ================= WEBRTC ================= */

async function startVoiceConnection() {

  if (peer) {

    peer.close();

    peer = null;

  }


  peer =
    new RTCPeerConnection({

      iceServers: [

        {
          urls:
            "stun:stun.l.google.com:19302"
        },

        {
          urls:
            "stun:stun1.l.google.com:19302"
        }

      ],

      iceCandidatePoolSize: 10

    });


  /* ================= LOCAL AUDIO ================= */

  localStream
    .getTracks()
    .forEach(track => {

      peer.addTrack(
        track,
        localStream
      );

    });


  /* ================= REMOTE AUDIO ================= */

  peer.ontrack =
    async event => {

      console.log(
        "🎧 REMOTE TRACK RECEIVED"
      );


      const stream =
        event.streams[0];


      if (!stream) {

        console.log(
          "❌ No remote stream"
        );

        return;

      }


      remoteAudio.srcObject =
        stream;

      remoteAudio.muted =
        !speakerOn;


      try {

        await remoteAudio.play();

        console.log(
          "🔊 REMOTE AUDIO PLAYING"
        );

        showStatus(
          "🟢 VOICE CONNECTED\n\n" +
          "🎧 Remote voice received."
        );

      }

      catch (error) {

        console.log(
          "AUDIO PLAY ERROR:",
          error
        );

        showStatus(
          "🟢 Voice connected\n\n" +
          "🔊 Tap the audio Play button."
        );

      }

    };


  /* ================= CONNECTION ================= */

  peer.onconnectionstatechange =
    () => {

      const state =
        peer.connectionState;

      console.log(
        "🔵 CONNECTION:",
        state
      );


      if (state === "connected") {

        clearTimeout(
          connectionTimer
        );

        showStatus(
          "🟢 VOICE CONNECTED\n\n" +
          "Voice connection established."
        );

      }


      else if (
        state === "connecting"
      ) {

        showStatus(
          "🟡 Connecting voice...\n\n" +
          "Please wait..."
        );

      }


      else if (
        state === "disconnected"
      ) {

        showStatus(
          "🟠 Voice disconnected.\n\n" +
          "Trying to recover..."
        );

      }


      else if (
        state === "failed"
      ) {

        clearTimeout(
          connectionTimer
        );

        showStatus(
          "🔴 VOICE FAILED\n\n" +
          "Network path could not be established."
        );

      }


      else if (
        state === "closed"
      ) {

        showStatus(
          "⚪ Voice connection closed."
        );

      }

    };


  /* ================= ICE ================= */

  peer.oniceconnectionstatechange =
    () => {

      console.log(
        "🧊 ICE:",
        peer.iceConnectionState
      );


      if (
        peer.iceConnectionState ===
        "connected" ||
        peer.iceConnectionState ===
        "completed"
      ) {

        console.log(
          "✅ ICE CONNECTION ESTABLISHED"
        );

      }


      if (
        peer.iceConnectionState ===
        "failed"
      ) {

        showStatus(
          "🔴 ICE FAILED\n\n" +
          "The two phones could not find a network path."
        );

      }

    };


  peer.onicegatheringstatechange =
    () => {

      console.log(
        "🧊 ICE GATHERING:",
        peer.iceGatheringState
      );

    };


  peer.onsignalingstatechange =
    () => {

      console.log(
        "📡 SIGNALING:",
        peer.signalingState
      );

    };


  /* ================= ROLE ================= */

  let roomSnapshot;

  try {

    roomSnapshot =
      await getDoc(roomRef);

  }

  catch (error) {

    showStatus(
      "❌ Firebase error\n\n" +
      error.message
    );

    return;

  }


  const existingData =
    roomSnapshot.exists()
      ? roomSnapshot.data()
      : null;


  /*
    FIRST USER = CALLER
    SECOND USER = CALLEE
  */

  if (
    !existingData ||
    !existingData.callerUid
  ) {

    isCaller = true;


    await setDoc(
      roomRef,
      {

        callerUid:
          currentUser.uid,

        callerName:
          currentUser.displayName ||
          "User",

        createdAt:
          Date.now(),

        status:
          "waiting"

      },
      {
        merge: true
      }
    );


    console.log(
      "👤 ROLE: CALLER"
    );

    await createOffer();

  }

  else if (
    existingData.callerUid !==
    currentUser.uid
  ) {

    isCaller = false;


    await setDoc(
      roomRef,
      {

        calleeUid:
          currentUser.uid,

        calleeName:
          currentUser.displayName ||
          "User",

        status:
          "connecting"

      },
      {
        merge: true
      }
    );


    console.log(
      "👤 ROLE: CALLEE"
    );

    await createAnswer(
      existingData
    );

  }

  else {

    showStatus(
      "⚠️ You are already the caller\n\n" +
      "Open the room from another account/device."
    );

    return;

  }


  /* ================= WATCH ROOM ================= */

  stopRoomListener =
    onSnapshot(
      roomRef,
      async snapshot => {

        if (!snapshot.exists())
          return;


        const data =
          snapshot.data();


        /*
          CALLER RECEIVES ANSWER
        */

        if (
          isCaller &&
          data.answer &&
          !remoteDescriptionSet
        ) {

          try {

            console.log(
              "📥 ANSWER RECEIVED"
            );


            await peer.setRemoteDescription(
              new RTCSessionDescription(
                data.answer
              )
            );


            remoteDescriptionSet =
              true;


            console.log(
              "✅ REMOTE ANSWER SET"
            );


            for (
              const candidate
              of pendingRemoteCandidates
            ) {

              try {

                await peer.addIceCandidate(
                  candidate
                );

              }

              catch (error) {

                console.log(
                  "Pending ICE error:",
                  error
                );

              }

            }


            pendingRemoteCandidates = [];

          }

          catch (error) {

            console.error(
              "ANSWER ERROR:",
              error
            );

            showStatus(
              "❌ Answer error\n\n" +
              error.message
            );

          }

        }

      }
    );


  /* ================= TIMEOUT ================= */

  connectionTimer =
    setTimeout(
      () => {

        if (
          peer &&
          peer.connectionState !==
          "connected"
        ) {

          showStatus(
            "⚠️ Connection taking too long.\n\n" +
            "Connection: " +
            peer.connectionState +
            "\n" +
            "ICE: " +
            peer.iceConnectionState +
            "\n" +
            "Signaling: " +
            peer.signalingState
          );

        }

      },
      20000
    );

}


/* ================= CREATE OFFER ================= */

async function createOffer() {

  try {

    showStatus(
      "📞 Creating voice call...\n\n" +
      "Preparing connection..."
    );


    const offer =
      await peer.createOffer({

        offerToReceiveAudio: true

      });


    await peer.setLocalDescription(
      offer
    );


    showStatus(
      "📡 Preparing network connection...\n\n" +
      "Please wait..."
    );


    await waitForIceGatheringComplete();


    const description =
      peer.localDescription;


    if (!description) {

      throw new Error(
        "Local offer was not created."
      );

    }


    await setDoc(

      roomRef,

      {

        offer: {

          type:
            description.type,

          sdp:
            description.sdp

        },

        status:
          "waiting"

      },

      {
        merge: true
      }

    );


    console.log(
      "✅ COMPLETE OFFER SAVED"
    );


    showStatus(
      "📞 Voice call ready.\n\n" +
      "Waiting for second user..."
    );

  }

  catch (error) {

    console.error(
      "OFFER ERROR:",
      error
    );

    showStatus(
      "❌ Offer error\n\n" +
      error.message
    );

  }

}


/* ================= CREATE ANSWER ================= */

async function createAnswer(data) {

  try {

    if (!data.offer) {

      showStatus(
        "❌ Voice offer not found.\n\n" +
        "Ask the first phone to join first."
      );

      return;

    }


    showStatus(
      "🟡 Joining voice call...\n\n" +
      "Preparing connection..."
    );


    await peer.setRemoteDescription(

      new RTCSessionDescription(
        data.offer
      )

    );


    remoteDescriptionSet =
      true;


    console.log(
      "✅ OFFER RECEIVED"
    );


    for (
      const candidate
      of pendingRemoteCandidates
    ) {

      try {

        await peer.addIceCandidate(
          candidate
        );

      }

      catch (error) {

        console.log(
          "Pending candidate error:",
          error
        );

      }

    }


    pendingRemoteCandidates = [];


    const answer =
      await peer.createAnswer();


    await peer.setLocalDescription(
      answer
    );


    showStatus(
      "📡 Preparing answer...\n\n" +
      "Please wait..."
    );


    await waitForIceGatheringComplete();


    const description =
      peer.localDescription;


    if (!description) {

      throw new Error(
        "Local answer was not created."
      );

    }


    await setDoc(

      roomRef,

      {

        answer: {

          type:
            description.type,

          sdp:
            description.sdp

        },

        status:
          "connected"

      },

      {
        merge: true
      }

    );


    console.log(
      "✅ COMPLETE ANSWER SAVED"
    );


    showStatus(
      "🟡 Answer sent.\n\n" +
      "Connecting voice..."
    );

  }

  catch (error) {

    console.error(
      "ANSWER CREATE ERROR:",
      error
    );

    showStatus(
      "❌ Connection error\n\n" +
      error.message
    );

  }

}


/* ================= MIC BUTTON ================= */

micButton.onclick =
  async () => {

    if (!localStream) {

      await startMicrophone();

      return;

    }


    micOn =
      !micOn;


    localStream
      .getAudioTracks()
      .forEach(track => {

        track.enabled =
          micOn;

      });


    if (micOn) {

      micButton.innerText =
        "🎙️ Mic ON";

      micButton.style.background =
        "#20b765";

    }

    else {

      micButton.innerText =
        "🔇 Mic OFF";

      micButton.style.background =
        "#555";

    }

  };


/* ================= SPEAKER ================= */

speakerButton.onclick =
  async () => {

    speakerOn =
      !speakerOn;


    remoteAudio.muted =
      !speakerOn;


    if (speakerOn) {

      speakerButton.innerText =
        "🔊 Speaker ON";

      speakerButton.style.background =
        "#20b765";


      try {

        await remoteAudio.play();

      }

      catch (error) {

        console.log(
          "Speaker play:",
          error
        );

      }

    }

    else {

      speakerButton.innerText =
        "🔇 Speaker OFF";

      speakerButton.style.background =
        "#555";

    }

  };


/* ================= LEAVE ================= */

leaveButton.onclick =
  async () => {

    await cleanup();

    window.location.href =
      "index.html";

  };


/* ================= CLEANUP ================= */

async function cleanup() {

  if (leaving)
    return;

  leaving = true;


  clearTimeout(
    connectionTimer
  );


  if (stopRoomListener) {

    stopRoomListener();

    stopRoomListener = null;

  }


  if (localStream) {

    localStream
      .getTracks()
      .forEach(track => {

        track.stop();

      });

    localStream = null;

  }


  if (peer) {

    peer.close();

    peer = null;

  }


  remoteAudio.pause();

  remoteAudio.srcObject =
    null;

}


/* ================= PAGE CLOSE ================= */

window.addEventListener(
  "beforeunload",
  () => {

    clearTimeout(
      connectionTimer
    );

    if (localStream) {

      localStream
        .getTracks()
        .forEach(track =>
          track.stop()
        );

    }

    if (peer) {

      peer.close();

    }

  }
);

</script>

</body>
</html>
