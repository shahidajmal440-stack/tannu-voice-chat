<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tannu Friends</title>

  <style>
    body {
      margin: 0;
      background: #17102b;
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
    }

    .room {
      padding: 25px 15px;
    }

    h1 {
      margin-bottom: 5px;
    }

    .live {
      color: #ff4d6d;
      font-weight: bold;
    }

    .host {
      margin: 10px 0 25px;
    }

    .users {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      max-width: 500px;
      margin: auto;
    }

    .user {
      background: #281c46;
      border-radius: 15px;
      padding: 18px 5px;
    }

    .avatar {
      width: 55px;
      height: 55px;
      background: #6c4cff;
      border-radius: 50%;
      margin: auto;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      font-weight: bold;
    }

    .controls {
      margin-top: 35px;
    }

    button {
      border: 0;
      border-radius: 12px;
      padding: 14px 20px;
      margin: 5px;
      font-size: 16px;
      font-weight: bold;
    }

    #mic {
      background: #555;
      color: white;
    }

    #speaker {
      background: #20b765;
      color: white;
    }

    #leave {
      background: #e5484d;
      color: white;
    }

    #status {
      margin: 20px auto;
      max-width: 500px;
      padding: 12px;
      border-radius: 10px;
      background: #211638;
      font-size: 14px;
      white-space: pre-line;
    }

    audio {
      display: none;
    }
  </style>
</head>

<body>

<div class="room">

  <h1>🎙️ Tannu Friends</h1>

  <div class="live">● LIVE</div>

  <div class="host">
    HOST: <b>Tannu</b>
  </div>

  <div class="users">

    <div class="user">
      <div class="avatar">T</div>
      <p>Tannu</p>
    </div>

    <div class="user">
      <div class="avatar">S</div>
      <p>Sameer</p>
    </div>

    <div class="user">
      <div class="avatar">R</div>
      <p>Rahul</p>
    </div>

    <div class="user">
      <div class="avatar">A</div>
      <p>Ali</p>
    </div>

    <div class="user">
      <div class="avatar">N</div>
      <p>Neha</p>
    </div>

    <div class="user">
      <div class="avatar">+</div>
      <p>Empty Seat</p>
    </div>

  </div>

  <div id="status">Checking login...</div>

  <div class="controls">
    <button id="mic">🎙️ Mic OFF</button>
    <button id="speaker">🔊 Speaker ON</button>
    <button id="leave">🚪 Leave</button>
  </div>

  <audio id="remoteAudio" autoplay playsinline></audio>

</div>

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";

import {
  getAuth,
  onAuthStateChanged
}
from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";

import {
  getFirestore,
  doc,
  getDoc,
  setDoc,
  runTransaction,
  onSnapshot,
  collection,
  addDoc
}
from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";


const firebaseConfig = {
  apiKey: "AIzaSyAc7BBn6G5zzAmB4Mx-3haVwE0aob5HlVc",
  authDomain: "tannu-voice-chat.firebaseapp.com",
  projectId: "tannu-voice-chat",
  storageBucket: "tannu-voice-chat.firebasestorage.app",
  messagingSenderId: "720483733073",
  appId: "1:720483733073:web:c65b96d255d6177b9d7270"
};


const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

const status = document.getElementById("status");
const micButton = document.getElementById("mic");
const speakerButton = document.getElementById("speaker");
const leaveButton = document.getElementById("leave");
const remoteAudio = document.getElementById("remoteAudio");

let currentUser = null;
let localStream = null;
let peer = null;

let micOn = false;
let speakerOn = true;

let isCaller = false;
let remoteDescriptionReady = false;
let pendingCandidates = [];

let stopRoomListener = null;
let stopCallerCandidates = null;
let stopCalleeCandidates = null;

const params = new URLSearchParams(location.search);
const roomId = params.get("room") || "test-room";

const roomRef = doc(db, "voiceRooms", roomId);

const callerCandidates =
  collection(roomRef, "callerCandidates");

const calleeCandidates =
  collection(roomRef, "calleeCandidates");


/* ================= LOGIN ================= */

onAuthStateChanged(auth, async (user) => {

  if (!user) {

    status.innerText =
      "❌ Please login first.";

    return;
  }

  currentUser = user;

  status.innerText =
    "✅ Login found\n" +
    "Welcome " +
    (user.displayName || "User") +
    "\n\n🎙️ Press Mic to join voice.";

});


/* ================= MICROPHONE ================= */

async function startMicrophone() {

  try {

    if (!currentUser) {

      status.innerText =
        "❌ Please login first.";

      return;
    }

    if (
      !navigator.mediaDevices ||
      !navigator.mediaDevices.getUserMedia
    ) {

      throw new Error(
        "Microphone is not supported."
      );

    }

    localStream =
      await navigator.mediaDevices.getUserMedia({

        audio: {
          echoCancellation: true,
          noiseSuppression: true,
          autoGainControl: true
        },

        video: false

      });


    micOn = true;

    micButton.innerText =
      "🎙️ Mic ON";

    micButton.style.background =
      "#20b765";


    status.innerText =
      "🎙️ Microphone ON\n\n" +
      "Connecting voice...";


    await startVoiceConnection();

  }

  catch (error) {

    console.error(
      "MIC ERROR:",
      error
    );

    status.innerText =
      "❌ Microphone error\n\n" +
      error.name +
      "\n" +
      error.message;

  }

}


/* ================= WEBRTC ================= */

async function startVoiceConnection() {

  peer =
    new RTCPeerConnection({

      iceServers: [

        {
          urls:
            "stun:stun.l.google.com:19302"
        },

        {
          urls:
            "stun:stun1.l.google.com:19302"
        }

      ]

    });


  /* Local audio */

  localStream
    .getTracks()
    .forEach(track => {

      peer.addTrack(
        track,
        localStream
      );

    });


  /* Remote audio */

  peer.ontrack = event => {

    console.log(
      "REMOTE AUDIO RECEIVED"
    );

    if (event.streams[0]) {

      remoteAudio.srcObject =
        event.streams[0];

      remoteAudio.muted =
        !speakerOn;

      remoteAudio.play()
        .catch(error => {

          console.log(
            "Audio play:",
            error
          );

        });

    }

  };


  /* Connection */

  peer.onconnectionstatechange = () => {

    console.log(
      "Connection:",
      peer.connectionState
    );


    if (
      peer.connectionState ===
      "connected"
    ) {

      status.innerText =
        "🟢 VOICE CONNECTED\n\n" +
        "Real voice connection active.";

    }


    else if (
      peer.connectionState ===
      "connecting"
    ) {

      status.innerText =
        "🟡 Connecting voice...";

    }


    else if (
      peer.connectionState ===
      "failed"
    ) {

      status.innerText =
        "🔴 Voice connection failed.\n\n" +
        "WebRTC connection could not be established.";

    }


    else if (
      peer.connectionState ===
      "disconnected"
    ) {

      status.innerText =
        "🟠 Voice disconnected.";

    }

  };


  peer.oniceconnectionstatechange =
    () => {

      console.log(
        "ICE:",
        peer.iceConnectionState
      );

    };


  /* ICE candidates */

  peer.onicecandidate =
    async event => {

      if (!event.candidate)
        return;

      try {

        const candidateData =
          event.candidate.toJSON();


        if (isCaller) {

          await addDoc(
            callerCandidates,
            candidateData
          );

        }

        else {

          await addDoc(
            calleeCandidates,
            candidateData
          );

        }

      }

      catch (error) {

        console.error(
          "ICE SAVE ERROR:",
          error
        );

      }

    };


  /* ================= ROLE ================= */

  try {

    await runTransaction(
      db,
      async transaction => {

        const snapshot =
          await transaction.get(
            roomRef
          );


        if (!snapshot.exists()) {

          isCaller = true;

          transaction.set(
            roomRef,
            {
              callerUid:
                currentUser.uid,

              createdAt:
                Date.now()
            }
          );

        }

        else {

          const data =
            snapshot.data();


          if (
            !data.callerUid
          ) {

            isCaller = true;

            transaction.update(
              roomRef,
              {
                callerUid:
                  currentUser.uid
              }
            );

          }

          else if (
            data.callerUid !==
            currentUser.uid
          ) {

            isCaller = false;

            transaction.update(
              roomRef,
              {
                calleeUid:
                  currentUser.uid
              }
            );

          }

          else {

            isCaller = true;

          }

        }

      }
    );

  }

  catch (error) {

    console.error(
      "ROLE ERROR:",
      error
    );

    status.innerText =
      "❌ Could not join voice room.";

    return;

  }


  console.log(
    "ROLE:",
    isCaller ?
    "CALLER" :
    "ANSWERER"
  );


  /* ================= CALLER ================= */

  if (isCaller) {

    status.innerText =
      "📞 Creating voice call...\n\n" +
      "Waiting for second user.";


    /* Listen for answer */

    stopRoomListener =
      onSnapshot(
        roomRef,
        async snapshot => {

          const data =
            snapshot.data();

          if (!data)
            return;


          if (
            data.answer &&
            !remoteDescriptionReady
          ) {

            try {

              await peer.setRemoteDescription(

                new RTCSessionDescription(
                  data.answer
                )

              );

              remoteDescriptionReady =
                true;


              for (
                const candidate
                of pendingCandidates
              ) {

                try {

                  await peer
                    .addIceCandidate(
                      candidate
                    );

                }

                catch (error) {

                  console.log(
                    "Pending ICE:",
                    error
                  );

                }

              }


              pendingCandidates = [];

            }

            catch (error) {

              console.error(
                "ANSWER ERROR:",
                error
              );

            }

          }

        }
      );


    /* Callee ICE */

    stopCalleeCandidates =
      onSnapshot(
        calleeCandidates,
        snapshot => {

          snapshot.docChanges()
            .forEach(
              async change => {

                if (
                  change.type !==
                  "added"
                )
                  return;


                const candidate =
                  new RTCIceCandidate(
                    change.doc.data()
                  );


                if (
                  remoteDescriptionReady
                ) {

                  try {

                    await peer
                      .addIceCandidate(
                        candidate
                      );

                  }

                  catch (error) {

                    console.log(
                      "ICE ERROR:",
                      error
                    );

                  }

                }

                else {

                  pendingCandidates.push(
                    candidate
                  );

                }

              }
            );

        }
      );


    /* Create offer */

    const offer =
      await peer.createOffer({

        offerToReceiveAudio: true

      });


    await peer.setLocalDescription(
      offer
    );


    await setDoc(

      roomRef,

      {

        offer: {

          type: offer.type,

          sdp: offer.sdp

        }

      },

      {
        merge: true
      }

    );


    status.innerText =
      "📞 Voice call created.\n\n" +
      "Waiting for second user...";

  }


  /* ================= ANSWERER ================= */

  else {

    status.innerText =
      "🟡 Joining voice call...";


    /* Caller ICE */

    stopCallerCandidates =
      onSnapshot(
        callerCandidates,
        snapshot => {

          snapshot.docChanges()
            .forEach(
              async change => {

                if (
                  change.type !==
                  "added"
                )
                  return;


                const candidate =
                  new RTCIceCandidate(
                    change.doc.data()
                  );


                if (
                  remoteDescriptionReady
                ) {

                  try {

                    await peer
                      .addIceCandidate(
                        candidate
                      );

                  }

                  catch (error) {

                    console.log(
                      "ICE ERROR:",
                      error
                    );

                  }

                }

                else {

                  pendingCandidates.push(
                    candidate
                  );

                }

              }
            );

        }
      );


    /* Get offer */

    const roomSnapshot =
      await getDoc(
        roomRef
      );


    const data =
      roomSnapshot.data();


    if (
      !data ||
      !data.offer
    ) {

      status.innerText =
        "❌ Voice offer not found.";

      return;

    }


    await peer.setRemoteDescription(

      new RTCSessionDescription(
        data.offer
      )

    );


    remoteDescriptionReady =
      true;


    /* Pending ICE */

    for (
      const candidate
      of pendingCandidates
    ) {

      try {

        await peer.addIceCandidate(
          candidate
        );

      }

      catch (error) {

        console.log(
          "Pending ICE:",
          error
        );

      }

    }


    pendingCandidates = [];


    /* Create answer */

    const answer =
      await peer.createAnswer();


    await peer.setLocalDescription(
      answer
    );


    await setDoc(

      roomRef,

      {

        answer: {

          type: answer.type,

          sdp: answer.sdp

        }

      },

      {
        merge: true
      }

    );


    status.innerText =
      "🟡 Answer sent.\n\n" +
      "Connecting voice...";

  }

}


/* ================= MIC BUTTON ================= */

micButton.onclick =
  async () => {

    if (!localStream) {

      await startMicrophone();

      return;

    }


    micOn =
      !micOn;


    localStream
      .getAudioTracks()
      .forEach(
        track => {

          track.enabled =
            micOn;

        }
      );


    if (micOn) {

      micButton.innerText =
        "🎙️ Mic ON";

      micButton.style.background =
        "#20b765";

    }

    else {

      micButton.innerText =
        "🔇 Mic OFF";

      micButton.style.background =
        "#555";

    }

  };


/* ================= SPEAKER ================= */

speakerButton.onclick =
  () => {

    speakerOn =
      !speakerOn;


    remoteAudio.muted =
      !speakerOn;


    if (speakerOn) {

      speakerButton.innerText =
        "🔊 Speaker ON";

      speakerButton.style.background =
        "#20b765";

      remoteAudio.play()
        .catch(() => {});

    }

    else {

      speakerButton.innerText =
        "🔇 Speaker OFF";

      speakerButton.style.background =
        "#555";

    }

  };


/* ================= LEAVE ================= */

leaveButton.onclick =
  () => {

    cleanup();

    window.location.href =
      "index.html";

  };


/* ================= CLEANUP ================= */

function cleanup() {

  if (stopRoomListener)
    stopRoomListener();

  if (stopCallerCandidates)
    stopCallerCandidates();

  if (stopCalleeCandidates)
    stopCalleeCandidates();


  if (localStream) {

    localStream
      .getTracks()
      .forEach(
        track => track.stop()
      );

  }


  if (peer) {

    peer.close();

  }


  remoteAudio.srcObject =
    null;

}


window.addEventListener(
  "beforeunload",
  cleanup
);

</script>

</body>
</html>
