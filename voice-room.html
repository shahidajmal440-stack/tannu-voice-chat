<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tannu Voice Room</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      background: linear-gradient(145deg, #120b24, #291052, #081525);
      color: white;
    }

    .room {
      max-width: 430px;
      min-height: 100vh;
      margin: auto;
      padding: 18px;
    }

    .top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 25px;
    }

    .back {
      border: 0;
      background: rgba(255,255,255,0.1);
      color: white;
      width: 42px;
      height: 42px;
      border-radius: 50%;
      font-size: 22px;
    }

    .title {
      text-align: center;
    }

    .title h1 {
      font-size: 20px;
    }

    .live {
      color: #65ffb0;
      font-size: 12px;
    }

    .room-box {
      background: rgba(255,255,255,0.08);
      border-radius: 24px;
      padding: 28px 15px;
      text-align: center;
    }

    .host {
      color: #ff9bd2;
      font-size: 12px;
      margin-bottom: 12px;
    }

    .avatar {
      width: 80px;
      height: 80px;
      margin: auto;
      border-radius: 50%;
      background: linear-gradient(135deg, #ff4da6, #8b5cf6);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 34px;
      font-weight: bold;
    }

    .room-box h2 {
      margin-top: 14px;
    }

    .room-box p {
      color: #c7bfd4;
      margin-top: 7px;
      font-size: 14px;
    }

    .status {
      margin-top: 15px;
      color: #65ffb0;
      font-size: 13px;
      line-height: 1.5;
      word-break: break-word;
    }

    .people {
      display: flex;
      justify-content: center;
      gap: 16px;
      margin-top: 28px;
      flex-wrap: wrap;
    }

    .person {
      font-size: 11px;
      color: #cfc8d8;
      text-align: center;
    }

    .mini {
      width: 52px;
      height: 52px;
      border-radius: 50%;
      background: #45305f;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 5px;
      font-size: 20px;
    }

    .controls {
      display: flex;
      justify-content: center;
      gap: 18px;
      margin-top: 40px;
    }

    .control {
      width: 68px;
      height: 68px;
      border: 0;
      border-radius: 50%;
      background: rgba(255,255,255,0.12);
      color: white;
      font-size: 25px;
    }

    .control span {
      display: block;
      font-size: 10px;
      margin-top: 3px;
    }

    .leave {
      background: #e83d5b;
    }

    .off {
      background: #555;
    }

    #remoteAudio {
      display: none;
    }
  </style>
</head>

<body>

  <div class="room">

    <div class="top">
      <button class="back" onclick="goBack()">←</button>

      <div class="title">
        <h1 id="roomName">Loading...</h1>
      </div>

      <div class="live" id="roomStatus">
        ● LIVE
      </div>
    </div>

    <div class="room-box">

      <div class="host" id="roomHost">
        ROOM HOST
      </div>

      <div class="avatar">
        T
      </div>

      <h2 id="roomTitle">
        Loading...
      </h2>

      <p id="roomUsers">
        Loading room data...
      </p>

      <div class="status" id="voiceStatus">
        Starting...
      </div>

      <div class="people">

        <div class="person">
          <div class="mini">A</div>
          Ali
        </div>

        <div class="person">
          <div class="mini">S</div>
          Sameer
        </div>

        <div class="person">
          <div class="mini">R</div>
          Rahul
        </div>

        <div class="person">
          <div class="mini">N</div>
          Neha
        </div>

      </div>

    </div>

    <div class="controls">

      <button id="mic" class="control" onclick="toggleMic()">
        🎙️
        <span id="micText">Mic</span>
      </button>

      <button id="speakerButton" class="control" onclick="speaker()">
        🔊
        <span id="speakerText">Speaker</span>
      </button>

      <button class="control leave" onclick="leaveRoom()">
        📞
        <span>Leave</span>
      </button>

    </div>

  </div>

  <audio id="remoteAudio" autoplay playsinline></audio>

  <script type="module">

    import { initializeApp }
      from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";

    import {
      getAuth,
      onAuthStateChanged
    } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";

    import {
      getFirestore,
      collection,
      getDocs,
      doc,
      setDoc,
      updateDoc,
      onSnapshot,
      addDoc,
      serverTimestamp,
      runTransaction
    } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";


    const firebaseConfig = {

      apiKey: "AIzaSyAc7BBnG5zzAmB4Mx-3haVwE0aob5HlVc",

      authDomain: "tannu-voice-chat.firebaseapp.com",

      projectId: "tannu-voice-chat",

      storageBucket: "tannu-voice-chat.firebasestorage.app",

      messagingSenderId: "720483733073",

      appId: "1:720483733073:web:c65b96d255d6177b9d7270"

    };


    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);


    let stream = null;
    let peer = null;
    let roomId = null;
    let userId = null;

    let muted = false;
    let isCaller = false;

    let roomUnsubscribe = null;
    let candidateUnsubscribe = null;

    let pendingCandidates = [];


    const remoteAudio =
      document.getElementById("remoteAudio");

    const voiceStatus =
      document.getElementById("voiceStatus");


    // GET ROOM ID

    const params =
      new URLSearchParams(window.location.search);

    roomId =
      params.get("room");


    if (!roomId) {

      voiceStatus.innerText =
        "❌ Room ID missing. Open room using Join Room.";

    }


    // LOAD ROOM

    async function loadRoom() {

      if (!roomId) return;

      try {

        voiceStatus.innerText =
          "Loading room...";

        const snapshot =
          await getDocs(
            collection(db, "rooms")
          );

        let found = false;

        snapshot.forEach((roomDoc) => {

          if (roomDoc.id === roomId) {

            found = true;

            const room =
              roomDoc.data();

            document.getElementById(
              "roomName"
            ).innerText =
              room.name || "Tannu Voice Room";

            document.getElementById(
              "roomTitle"
            ).innerText =
              (room.name || "Tannu Friends") +
              " 🎙️";

            document.getElementById(
              "roomHost"
            ).innerText =
              "HOST: " +
              (room.host || "Tannu");

            document.getElementById(
              "roomStatus"
            ).innerText =
              "● " +
              (room.status || "LIVE")
                .toUpperCase();

            document.getElementById(
              "roomUsers"
            ).innerText =
              "👥 " +
              (room.users || 0) +
              " Users";

          }

        });


        if (!found) {

          voiceStatus.innerText =
            "❌ Room not found.";

        }

      } catch (error) {

        console.error(
          "ROOM ERROR:",
          error
        );

        voiceStatus.innerText =
          "❌ Room loading error: " +
          error.message;

      }

    }


    loadRoom();


    // AUTH

    onAuthStateChanged(
      auth,
      async (user) => {

        if (!user) {

          voiceStatus.innerText =
            "❌ Please login first.";

          return;

        }

        userId =
          user.uid;

        console.log(
          "Logged in:",
          userId
        );

        await startVoice();

      }
    );


    // CREATE PEER

    async function createPeer() {

      peer =
        new RTCPeerConnection({

          iceServers: [

            {
              urls:
                "stun:stun.l.google.com:19302"
            },

            {
              urls:
                "stun:stun1.l.google.com:19302"
            }

          ]

        });


      peer.onicecandidate =
        async (event) => {

          if (
            !event.candidate ||
            !roomId ||
            !userId
          ) return;


          try {

            await addDoc(

              collection(
                db,
                "voiceRooms",
                roomId,
                "candidates"
              ),

              {

                candidate:
                  event.candidate.toJSON(),

                userId:
                  userId,

                createdAt:
                  serverTimestamp()

              }

            );

          } catch (error) {

            console.error(
              "ICE ERROR:",
              error
            );

          }

        };


      peer.ontrack =
        async (event) => {

          console.log(
            "Remote audio received"
          );

          if (
            event.streams &&
            event.streams[0]
          ) {

            remoteAudio.srcObject =
              event.streams[0];

          }

          try {

            await remoteAudio.play();

          } catch (error) {

            console.log(
              "Autoplay blocked:",
              error
            );

          }

          voiceStatus.innerText =
            "🟢 Voice connected";

        };


      peer.onconnectionstatechange =
        () => {

          console.log(
            "Connection:",
            peer.connectionState
          );

          if (
            peer.connectionState ===
            "connected"
          ) {

            voiceStatus.innerText =
              "🟢 Voice connected";

          }

          else if (
            peer.connectionState ===
            "connecting"
          ) {

            voiceStatus.innerText =
              "🔗 Connecting voice...";

          }

          else if (
            peer.connectionState ===
            "disconnected"
          ) {

            voiceStatus.innerText =
              "Voice disconnected ❌";

          }

          else if (
            peer.connectionState ===
            "failed"
          ) {

            voiceStatus.innerText =
              "Voice connection failed ❌";

          }

        };


      if (stream) {

        stream
          .getTracks()
          .forEach((track) => {

            peer.addTrack(
              track,
              stream
            );

          });

      }

    }


    // START VOICE

    async function startVoice() {

      try {

        if (!roomId) {

          voiceStatus.innerText =
            "❌ Room ID missing.";

          return;

        }


        if (
          !window.isSecureContext
        ) {

          voiceStatus.innerText =
            "❌ Secure connection required.";

          return;

        }


        if (
          !navigator.mediaDevices
        ) {

          voiceStatus.innerText =
            "❌ Browser microphone API unavailable.";

          return;

        }


        if (
          !navigator.mediaDevices.getUserMedia
        ) {

          voiceStatus.innerText =
            "❌ Microphone API unavailable.";

          return;

        }


        voiceStatus.innerText =
          "🎤 Requesting microphone...";


        stream =
          await navigator.mediaDevices.getUserMedia({

            audio: true,

            video: false

          });


        const tracks =
          stream.getAudioTracks();


        if (!tracks.length) {

          throw new Error(
            "No microphone track found."
          );

        }


        tracks.forEach(
          (track) => {

            track.enabled = true;

          }
        );


        console.log(
          "MICROPHONE READY:",
          tracks[0].label
        );


        muted = false;


        document.getElementById(
          "micText"
        ).innerText =
          "Mute";


        voiceStatus.innerText =
          "🎤 Microphone ready";


        await createPeer();


        const roomRef =
          doc(
            db,
            "voiceRooms",
            roomId
          );


        await runTransaction(
          db,
          async (transaction) => {

            const snap =
              await transaction.get(roomRef);


            if (!snap.exists()) {

              transaction.set(
                roomRef,
                {

                  callerId:
                    userId,

                  createdAt:
                    serverTimestamp()

                }
              );

              isCaller =
                true;

            }

            else {

              const data =
                snap.data();

              isCaller =
                data.callerId === userId;

            }

          }
        );


        if (isCaller) {

          await createOffer();

        }

        else {

          await listenForOffer();

        }


      } catch (error) {

        console.error(
          "VOICE ERROR:",
          error
        );


        const name =
          error.name || "UnknownError";

        const message =
          error.message ||
          "Unknown microphone error";


        voiceStatus.innerText =
          "❌ Mic error: " +
          name;


        alert(
          "Microphone error:\n\n" +
          name +
          "\n" +
          message
        );

      }

    }


    // CREATE OFFER

    async function createOffer() {

      voiceStatus.innerText =
        "Waiting for another user...";


      const offer =
        await peer.createOffer();


      await peer.setLocalDescription(
        offer
      );


      const roomRef =
        doc(
          db,
          "voiceRooms",
          roomId
        );


      await updateDoc(
        roomRef,
        {

          offer: {

            type:
              offer.type,

            sdp:
              offer.sdp

          }

        }
      );


      roomUnsubscribe =
        onSnapshot(
          roomRef,
          async (snapshot) => {

            const data =
              snapshot.data();


            if (
              !data ||
              !data.answer
            ) return;


            if (
              peer.currentRemoteDescription
            ) return;


            try {

              await peer.setRemoteDescription(
                new RTCSessionDescription(
                  data.answer
                )
              );


              voiceStatus.innerText =
                "🔗 Connecting voice...";


              await addPendingCandidates();

            } catch (error) {

              console.error(
                "ANSWER ERROR:",
                error
              );

            }

          }
        );


      listenForCandidates();

    }


    // LISTEN FOR OFFER

    async function listenForOffer() {

      voiceStatus.innerText =
        "Joining voice room...";


      const roomRef =
        doc(
          db,
          "voiceRooms",
          roomId
        );


      roomUnsubscribe =
        onSnapshot(
          roomRef,
          async (snapshot) => {

            const data =
              snapshot.data();


            if (
              !data ||
              !data.offer
            ) return;


            if (
              peer.currentRemoteDescription
            ) return;


            try {

              await peer.setRemoteDescription(

                new RTCSessionDescription(
                  data.offer
                )

              );


              await addPendingCandidates();


              const answer =
                await peer.createAnswer();


              await peer.setLocalDescription(
                answer
              );


              await updateDoc(
                roomRef,
                {

                  answer: {

                    type:
                      answer.type,

                    sdp:
                      answer.sdp

                  }

                }
              );


              voiceStatus.innerText =
                "🔗 Connecting voice...";

            } catch (error) {

              console.error(
                "OFFER ERROR:",
                error
              );

            }

          }
        );


      listenForCandidates();

    }


    // ICE CANDIDATES

    function listenForCandidates() {

      candidateUnsubscribe =
        onSnapshot(

          collection(
            db,
            "voiceRooms",
            roomId,
            "candidates"
          ),

          async (snapshot) => {

            for (
              const change of
              snapshot.docChanges()
            ) {

              if (
                change.type !==
                "added"
              ) continue;


              const data =
                change.doc.data();


              if (
                data.userId === userId
              ) continue;


              if (!peer) continue;


              const candidate =
                new RTCIceCandidate(
                  data.candidate
                );


              if (
                peer.remoteDescription
              ) {

                try {

                  await peer.addIceCandidate(
                    candidate
                  );

                } catch (error) {

                  console.error(
                    "ICE ERROR:",
                    error
                  );

                }

              }

              else {

                pendingCandidates.push(
                  candidate
                );

              }

            }

          }

        );

    }


    // ADD PENDING ICE

    async function addPendingCandidates() {

      if (
        !peer ||
        !peer.remoteDescription
      ) return;


      for (
        const candidate
        of pendingCandidates
      ) {

        try {

          await peer.addIceCandidate(
            candidate
          );

        } catch (error) {

          console.error(
            "PENDING ICE ERROR:",
            error
          );

        }

      }


      pendingCandidates = [];

    }


    // MIC BUTTON

    window.toggleMic =
      function () {

        if (!stream) {

          alert(
            "Microphone is not ready yet."
          );

          return;

        }


        const tracks =
          stream.getAudioTracks();


        if (!tracks.length) {

          alert(
            "Microphone track not found."
          );

          return;

        }


        muted =
          !muted;


        tracks.forEach(
          (track) => {

            track.enabled =
              !muted;

          }
        );


        const mic =
          document.getElementById("mic");


        const text =
          document.getElementById("micText");


        if (muted) {

          mic.classList.add("off");

          text.innerText =
            "Unmute";

          voiceStatus.innerText =
            "🔇 Microphone muted";

        }

        else {

          mic.classList.remove("off");

          text.innerText =
            "Mute";

          voiceStatus.innerText =
            "🎤 Microphone ON";

        }

      };


    // SPEAKER

    window.speaker =
      function () {

        remoteAudio.muted =
          !remoteAudio.muted;


        document.getElementById(
          "speakerText"
        ).innerText =
          remoteAudio.muted
            ? "Off"
            : "Speaker";


        voiceStatus.innerText =
          remoteAudio.muted
            ? "🔇 Speaker OFF"
            : "🔊 Speaker ON";

      };


    // LEAVE

    window.leaveRoom =
      function () {

        cleanup();

        window.location.href =
          "index.html";

      };


    window.goBack =
      function () {

        cleanup();

        window.location.href =
          "index.html";

      };


    // CLEANUP

    function cleanup() {

      if (roomUnsubscribe) {

        roomUnsubscribe();

        roomUnsubscribe =
          null;

      }


      if (candidateUnsubscribe) {

        candidateUnsubscribe();

        candidateUnsubscribe =
          null;

      }


      if (stream) {

        stream
          .getTracks()
          .forEach(
            (track) => track.stop()
          );

        stream =
          null;

      }


      if (peer) {

        peer.close();

        peer =
          null;

      }


      remoteAudio.srcObject =
        null;

    }

  </script>

</body>
</html>
