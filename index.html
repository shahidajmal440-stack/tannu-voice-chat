<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tannu Voice Chat</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      background: linear-gradient(145deg, #17102b, #241044, #0d1528);
      color: white;
    }

    .app {
      width: 100%;
      max-width: 430px;
      min-height: 100vh;
      margin: auto;
      padding: 22px 18px 35px;
    }

    .top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 25px;
    }

    .brand {
      font-size: 22px;
      font-weight: bold;
    }

    .profile {
      width: 45px;
      height: 45px;
      border-radius: 50%;
      background: linear-gradient(135deg, #ff4da6, #8b5cf6);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      font-size: 20px;
      font-weight: bold;
    }

    .profile img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .welcome {
      margin-bottom: 18px;
    }

    .welcome h2 {
      font-size: 25px;
      margin-bottom: 5px;
    }

    .welcome p {
      color: #aaa3bb;
      font-size: 14px;
    }

    .login {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 25px;
      background: white;
      color: #222;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      margin-bottom: 22px;
    }

    .search {
      width: 100%;
      padding: 14px 18px;
      border: 1px solid #40345a;
      border-radius: 25px;
      background: #211936;
      color: white;
      outline: none;
      font-size: 15px;
      margin-bottom: 20px;
    }

    .search::placeholder {
      color: #8f889e;
    }

    .section-title {
      font-size: 20px;
      font-weight: bold;
      margin-bottom: 12px;
    }

    .categories {
      display: flex;
      gap: 9px;
      overflow-x: auto;
      margin-bottom: 22px;
    }

    .category {
      flex-shrink: 0;
      padding: 9px 16px;
      border-radius: 20px;
      background: #2b2042;
      color: #ddd6e8;
      font-size: 13px;
    }

    .category.active {
      background: linear-gradient(90deg, #ff4da6, #8b5cf6);
      color: white;
    }

    .room {
      background: #211936;
      border: 1px solid #3a2d50;
      border-radius: 18px;
      padding: 16px;
      margin-bottom: 12px;
    }

    .room-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }

    .room-name {
      font-size: 18px;
      font-weight: bold;
    }

    .live {
      color: #ff5b8d;
      font-size: 12px;
      font-weight: bold;
    }

    .room-info {
      color: #aaa3bb;
      font-size: 13px;
      margin-bottom: 14px;
    }

    .join {
      width: 100%;
      padding: 11px;
      border: none;
      border-radius: 22px;
      background: linear-gradient(90deg, #ff4da6, #8b5cf6);
      color: white;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
    }

    .empty {
      text-align: center;
      color: #9992aa;
      padding: 30px 10px;
    }
  </style>
</head>

<body>

  <div class="app">

    <div class="top">
      <div class="brand">Tannu Voice Chat</div>

      <div class="profile" id="profile">
        T
      </div>
    </div>

    <div class="welcome">
      <h2 id="welcomeText">Welcome 👋</h2>
      <p>Meet new friends • Enjoy voice rooms • Have fun</p>
    </div>

    <button class="login" id="loginBtn">
      🔐 Login with Google
    </button>

    <input
      class="search"
      id="searchInput"
      type="text"
      placeholder="🔍 Search rooms..."
    >

    <div class="section-title">Categories</div>

    <div class="categories">
      <div class="category active">Popular</div>
      <div class="category">Music</div>
      <div class="category">Chat</div>
      <div class="category">Games</div>
    </div>

    <div class="section-title">🔥 Popular Rooms</div>

    <div id="rooms">
      <div class="empty">Loading rooms...</div>
    </div>

  </div>


  <script type="module">

    import { initializeApp }
      from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";

    import {
      getAuth,
      GoogleAuthProvider,
      signInWithPopup,
      onAuthStateChanged,
      signOut
    } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";

    import {
      getFirestore,
      collection,
      getDocs
    } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";


    const firebaseConfig = {

      apiKey: "AIzaSyAc7BBn6G5zzAmB4Mx-3haVwE0aob5HlVc",

      authDomain: "tannu-voice-chat.firebaseapp.com",

      projectId: "tannu-voice-chat",

      storageBucket: "tannu-voice-chat.firebasestorage.app",

      messagingSenderId: "720483733073",

      appId: "1:720483733073:web:c65b96d255d6177b9d7270"

    };


    const app =
      initializeApp(firebaseConfig);

    const auth =
      getAuth(app);

    const db =
      getFirestore(app);

    const provider =
      new GoogleAuthProvider();


    let allRooms = [];


    // LOGIN

    async function loginWithGoogle() {

      try {

        const result =
          await signInWithPopup(
            auth,
            provider
          );

        console.log(
          "LOGIN SUCCESS:",
          result.user.uid
        );

      } catch (error) {

        console.error(
          "LOGIN ERROR:",
          error
        );

        alert(
          "Login failed:\n" +
          error.message
        );

      }

    }


    // LOGOUT

    async function logout() {

      try {

        await signOut(auth);

      } catch (error) {

        console.error(
          "LOGOUT ERROR:",
          error
        );

      }

    }


    const loginBtn =
      document.getElementById(
        "loginBtn"
      );


    loginBtn.onclick =
      loginWithGoogle;


    // AUTH STATE

    onAuthStateChanged(
      auth,
      (user) => {

        const welcomeText =
          document.getElementById(
            "welcomeText"
          );

        const profile =
          document.getElementById(
            "profile"
          );


        if (user) {

          console.log(
            "AUTH USER:",
            user.uid
          );


          const name =
            user.displayName ||
            "User";


          welcomeText.textContent =
            "Welcome, " +
            name +
            " 👋";


          loginBtn.textContent =
            "🚪 Logout";


          loginBtn.onclick =
            logout;


          if (user.photoURL) {

            profile.innerHTML =
              '<img src="' +
              user.photoURL +
              '" alt="Profile">';

          } else {

            profile.textContent =
              name
                .charAt(0)
                .toUpperCase();

          }

        } else {

          console.log(
            "NO USER LOGGED IN"
          );


          welcomeText.textContent =
            "Welcome 👋";


          loginBtn.textContent =
            "🔐 Login with Google";


          loginBtn.onclick =
            loginWithGoogle;


          profile.textContent =
            "T";

        }

      }
    );


    // LOAD ROOMS

    async function loadRooms() {

      const roomsContainer =
        document.getElementById(
          "rooms"
        );


      try {

        const snapshot =
          await getDocs(
            collection(
              db,
              "rooms"
            )
          );


        allRooms = [];


        snapshot.forEach(
          (roomDoc) => {

            allRooms.push({

              id:
                roomDoc.id,

              ...roomDoc.data()

            });

          }
        );


        displayRooms(
          allRooms
        );


      } catch (error) {

        console.error(
          "ROOM ERROR:",
          error
        );


        roomsContainer.innerHTML =
          '<div class="empty">' +
          'Unable to load rooms.' +
          '</div>';

      }

    }


    // DISPLAY ROOMS

    function displayRooms(
      rooms
    ) {

      const roomsContainer =
        document.getElementById(
          "rooms"
        );


      if (
        rooms.length === 0
      ) {

        roomsContainer.innerHTML =
          '<div class="empty">' +
          'No rooms found.' +
          '</div>';

        return;

      }


      roomsContainer.innerHTML =
        "";


      rooms.forEach(
        (room) => {

          const roomName =
            room.name ||
            "Unnamed Room";

          const host =
            room.host ||
            "Host";

          const status =
            room.status ||
            "live";

          const users =
            room.users ||
            0;


          const div =
            document.createElement(
              "div"
            );


          div.className =
            "room";


          div.innerHTML = `

            <div class="room-top">

              <div class="room-name">
                ${roomName}
              </div>

              <div class="live">
                🔴 ${status}
              </div>

            </div>

            <div class="room-info">
              👤 Host: ${host}
              &nbsp; • &nbsp;
              🎙️ ${users} users
            </div>

            <button class="join">
              Join Room
            </button>

          `;


          div
            .querySelector(".join")
            .addEventListener(
              "click",
              async () => {

                const currentUser =
                  auth.currentUser;


                // LOGIN CHECK

                if (!currentUser) {

                  alert(
                    "Please login with Google first."
                  );

                  return;

                }


                // WAIT FOR AUTH

                const uid =
                  currentUser.uid;


                console.log(
                  "OPENING ROOM:",
                  room.id,
                  "USER:",
                  uid
                );


                window.location.href =
                  "voice-room.html?room=" +
                  encodeURIComponent(
                    room.id
                  );

              }
            );


          roomsContainer.appendChild(
            div
          );

        }
      );

    }


    // SEARCH

    document
      .getElementById(
        "searchInput"
      )
      .addEventListener(
        "input",
        () => {

          const search =
            document
              .getElementById(
                "searchInput"
              )
              .value
              .toLowerCase()
              .trim();


          const filtered =
            allRooms.filter(
              (room) => {

                const name =
                  (
                    room.name ||
                    ""
                  ).toLowerCase();


                const host =
                  (
                    room.host ||
                    ""
                  ).toLowerCase();


                return (
                  name.includes(
                    search
                  ) ||
                  host.includes(
                    search
                  )
                );

              }
            );


          displayRooms(
            filtered
          );

        }
      );


    // START

    loadRooms();

  </script>

</body>
</html>
