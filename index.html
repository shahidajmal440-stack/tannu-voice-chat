<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tannu Voice Chat</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      background:
        radial-gradient(circle at top left, #4b1d68 0%, transparent 35%),
        radial-gradient(circle at top right, #172d62 0%, transparent 30%),
        linear-gradient(145deg, #10091f, #1b1033, #091323);
      color: white;
      padding-bottom: 80px;
    }

    .app {
      width: 100%;
      max-width: 430px;
      min-height: 100vh;
      margin: auto;
      padding: 18px 16px 95px;
    }

    /* TOP */

    .top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 22px;
    }

    .brand-area {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .logo {
      width: 42px;
      height: 42px;
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #ff4da6, #8b5cf6);
      font-size: 20px;
      font-weight: bold;
      box-shadow: 0 8px 25px rgba(139, 92, 246, 0.25);
    }

    .brand {
      font-size: 20px;
      font-weight: bold;
    }

    .brand-sub {
      color: #a9a1bb;
      font-size: 11px;
      margin-top: 2px;
    }

    .profile {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: linear-gradient(135deg, #ff4da6, #8b5cf6);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      font-size: 19px;
      font-weight: bold;
      border: 2px solid rgba(255,255,255,0.15);
    }

    .profile img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* WELCOME */

    .welcome {
      margin-bottom: 18px;
    }

    .welcome h2 {
      font-size: 25px;
      margin-bottom: 6px;
    }

    .welcome p {
      color: #aaa3bb;
      font-size: 13px;
    }

    /* LOGIN */

    .login {
      width: 100%;
      padding: 13px;
      border: none;
      border-radius: 16px;
      background: white;
      color: #222;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
      margin-bottom: 18px;
    }

    /* SEARCH */

    .search-box {
      position: relative;
      margin-bottom: 22px;
    }

    .search {
      width: 100%;
      padding: 14px 18px 14px 45px;
      border: 1px solid #3d3154;
      border-radius: 16px;
      background: rgba(33, 25, 54, 0.9);
      color: white;
      outline: none;
      font-size: 14px;
    }

    .search-icon {
      position: absolute;
      left: 17px;
      top: 13px;
      font-size: 16px;
    }

    .search::placeholder {
      color: #8f889e;
    }

    /* CATEGORIES */

    .section-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .section-title {
      font-size: 19px;
      font-weight: bold;
    }

    .see-all {
      color: #c9a8ff;
      font-size: 12px;
    }

    .categories {
      display: flex;
      gap: 9px;
      overflow-x: auto;
      margin-bottom: 25px;
      scrollbar-width: none;
    }

    .categories::-webkit-scrollbar {
      display: none;
    }

    .category {
      flex-shrink: 0;
      padding: 10px 15px;
      border-radius: 14px;
      background: #2b2042;
      color: #ddd6e8;
      font-size: 12px;
      border: 1px solid #3b2e51;
    }

    .category.active {
      background: linear-gradient(90deg, #ff4da6, #8b5cf6);
      color: white;
      border-color: transparent;
    }

    /* POPULAR ROOMS */

    .rooms-title {
      margin-bottom: 12px;
    }

    .room {
      position: relative;
      background:
        linear-gradient(145deg, rgba(49, 34, 78, 0.95), rgba(29, 23, 51, 0.95));
      border: 1px solid #403356;
      border-radius: 20px;
      padding: 16px;
      margin-bottom: 13px;
      overflow: hidden;
    }

    .room::before {
      content: "";
      position: absolute;
      width: 90px;
      height: 90px;
      background: #8b5cf6;
      opacity: 0.08;
      border-radius: 50%;
      right: -25px;
      top: -25px;
    }

    .room-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin-bottom: 13px;
    }

    .room-title-area {
      min-width: 0;
    }

    .room-name {
      font-size: 17px;
      font-weight: bold;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .room-tag {
      color: #a99dbd;
      font-size: 11px;
      margin-top: 4px;
    }

    .live {
      flex-shrink: 0;
      color: #ff6c99;
      background: rgba(255, 91, 141, 0.10);
      border: 1px solid rgba(255, 91, 141, 0.20);
      padding: 5px 8px;
      border-radius: 10px;
      font-size: 10px;
      font-weight: bold;
    }

    .room-info {
      display: flex;
      justify-content: space-between;
      color: #aaa3bb;
      font-size: 12px;
      margin-bottom: 14px;
    }

    .room-info strong {
      color: #ddd6e8;
    }

    .join {
      width: 100%;
      padding: 11px;
      border: none;
      border-radius: 13px;
      background: linear-gradient(90deg, #ff4da6, #8b5cf6);
      color: white;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
    }

    .join:active {
      transform: scale(0.98);
    }

    .empty {
      text-align: center;
      color: #9992aa;
      padding: 35px 10px;
      background: rgba(33, 25, 54, 0.7);
      border-radius: 18px;
    }

    /* BOTTOM NAV */

    .bottom-nav {
      position: fixed;
      left: 50%;
      bottom: 10px;
      transform: translateX(-50%);
      width: calc(100% - 22px);
      max-width: 408px;
      background: rgba(24, 17, 43, 0.96);
      border: 1px solid #3c3050;
      border-radius: 20px;
      padding: 9px 6px;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      z-index: 100;
      backdrop-filter: blur(15px);
    }

    .nav-item {
      border: none;
      background: transparent;
      color: #8e879d;
      font-size: 10px;
      padding: 6px 2px;
      cursor: pointer;
    }

    .nav-icon {
      display: block;
      font-size: 18px;
      margin-bottom: 3px;
    }

    .nav-item.active {
      color: #ff70b2;
    }

    @media (max-width: 360px) {
      .brand {
        font-size: 17px;
      }

      .welcome h2 {
        font-size: 22px;
      }
    }
  </style>
</head>

<body>

  <div class="app">

    <!-- TOP -->

    <div class="top">

      <div class="brand-area">

        <div class="logo">
          T
        </div>

        <div>
          <div class="brand">
            Tannu Voice Chat
          </div>

          <div class="brand-sub">
            Meet • Talk • Enjoy
          </div>
        </div>

      </div>

      <div class="profile" id="profile">
        T
      </div>

    </div>


    <!-- WELCOME -->

    <div class="welcome">

      <h2 id="welcomeText">
        Welcome 👋
      </h2>

      <p>
        Meet new friends • Enjoy voice rooms • Have fun
      </p>

    </div>


    <!-- LOGIN -->

    <button class="login" id="loginBtn">
      🔐 Login with Google
    </button>


    <!-- SEARCH -->

    <div class="search-box">

      <span class="search-icon">
        🔍
      </span>

      <input
        class="search"
        id="searchInput"
        type="text"
        placeholder="Search rooms or hosts..."
      >

    </div>


    <!-- CATEGORIES -->

    <div class="section-head">

      <div class="section-title">
        Categories
      </div>

      <div class="see-all">
        Explore
      </div>

    </div>


    <div class="categories">

      <div class="category active">
        🔥 Popular
      </div>

      <div class="category">
        🎵 Music
      </div>

      <div class="category">
        💬 Chat
      </div>

      <div class="category">
        🎮 Games
      </div>

      <div class="category">
        ❤️ Friends
      </div>

    </div>


    <!-- POPULAR ROOMS -->

    <div class="section-head rooms-title">

      <div class="section-title">
        🔥 Popular Rooms
      </div>

      <div class="see-all">
        Live Now
      </div>

    </div>


    <div id="rooms">

      <div class="empty">
        Loading rooms...
      </div>

    </div>

  </div>


  <!-- BOTTOM NAV -->

  <div class="bottom-nav">

    <button class="nav-item active">
      <span class="nav-icon">🏠</span>
      Home
    </button>

    <button class="nav-item">
      <span class="nav-icon">🎙️</span>
      Rooms
    </button>

    <button class="nav-item">
      <span class="nav-icon">🎉</span>
      Events
    </button>

    <button class="nav-item">
      <span class="nav-icon">👤</span>
      Profile
    </button>

  </div>


  <!-- FIREBASE -->

  <script type="module">

    import { initializeApp }
      from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";

    import {
      getAuth,
      GoogleAuthProvider,
      signInWithPopup,
      onAuthStateChanged,
      signOut
    } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";

    import {
      getFirestore,
      collection,
      getDocs
    } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";


    const firebaseConfig = {

      apiKey: "AIzaSyAc7BBn6G5zzAmB4Mx-3haVwE0aob5HlVc",

      authDomain: "tannu-voice-chat.firebaseapp.com",

      projectId: "tannu-voice-chat",

      storageBucket: "tannu-voice-chat.firebasestorage.app",

      messagingSenderId: "720483733073",

      appId: "1:720483733073:web:c65b96d255d6177b9d7270"

    };


    const app =
      initializeApp(firebaseConfig);

    const auth =
      getAuth(app);

    const db =
      getFirestore(app);

    const provider =
      new GoogleAuthProvider();


    let allRooms = [];


    /* LOGIN */

    async function loginWithGoogle() {

      try {

        const result =
          await signInWithPopup(
            auth,
            provider
          );

        console.log(
          "LOGIN SUCCESS:",
          result.user.uid
        );

      } catch (error) {

        console.error(
          "LOGIN ERROR:",
          error
        );

        alert(
          "Login failed:\n" +
          error.message
        );

      }

    }


    /* LOGOUT */

    async function logout() {

      try {

        await signOut(auth);

      } catch (error) {

        console.error(
          "LOGOUT ERROR:",
          error
        );

      }

    }


    const loginBtn =
      document.getElementById(
        "loginBtn"
      );


    loginBtn.onclick =
      loginWithGoogle;


    /* AUTH STATE */

    onAuthStateChanged(
      auth,
      (user) => {

        const welcomeText =
          document.getElementById(
            "welcomeText"
          );

        const profile =
          document.getElementById(
            "profile"
          );


        if (user) {

          const name =
            user.displayName ||
            "User";


          welcomeText.textContent =
            "Welcome, " +
            name +
            " 👋";


          loginBtn.textContent =
            "🚪 Logout";


          loginBtn.onclick =
            logout;


          if (user.photoURL) {

            profile.innerHTML =
              '<img src="' +
              user.photoURL +
              '" alt="Profile">';

          } else {

            profile.textContent =
              name
                .charAt(0)
                .toUpperCase();

          }

        } else {

          welcomeText.textContent =
            "Welcome 👋";


          loginBtn.textContent =
            "🔐 Login with Google";


          loginBtn.onclick =
            loginWithGoogle;


          profile.textContent =
            "T";

        }

      }
    );


    /* LOAD ROOMS */

    async function loadRooms() {

      const roomsContainer =
        document.getElementById(
          "rooms"
        );


      try {

        const snapshot =
          await getDocs(
            collection(
              db,
              "rooms"
            )
          );


        allRooms = [];


        snapshot.forEach(
          (roomDoc) => {

            allRooms.push({

              id:
                roomDoc.id,

              ...roomDoc.data()

            });

          }
        );


        displayRooms(
          allRooms
        );


      } catch (error) {

        console.error(
          "ROOM ERROR:",
          error
        );


        roomsContainer.innerHTML =
          '<div class="empty">' +
          'Unable to load rooms.' +
          '</div>';

      }

    }


    /* DISPLAY ROOMS */

    function displayRooms(
      rooms
    ) {

      const roomsContainer =
        document.getElementById(
          "rooms"
        );


      if (
        rooms.length === 0
      ) {

        roomsContainer.innerHTML =
          '<div class="empty">' +
          'No rooms found.' +
          '</div>';

        return;

      }


      roomsContainer.innerHTML =
        "";


      rooms.forEach(
        (room) => {

          const roomName =
            room.name ||
            "Unnamed Room";


          const host =
            room.host ||
            "Host";


          const status =
            room.status ||
            "LIVE";


          const users =
            room.users ||
            0;


          const div =
            document.createElement(
              "div"
            );


          div.className =
            "room";


          div.innerHTML = `

            <div class="room-top">

              <div class="room-title-area">

                <div class="room-name">
                  ${roomName}
                </div>

                <div class="room-tag">
                  🎙️ Voice Chat Room
                </div>

              </div>

              <div class="live">
                🔴 ${status}
              </div>

            </div>

            <div class="room-info">

              <span>
                👤 <strong>${host}</strong>
              </span>

              <span>
                🎙️ <strong>${users}</strong> users
              </span>

            </div>

            <button class="join">
              🎙️ Join Room
            </button>

          `;


          div
            .querySelector(".join")
            .addEventListener(
              "click",
              () => {

                const currentUser =
                  auth.currentUser;


                if (!currentUser) {

                  alert(
                    "Please login with Google first."
                  );

                  return;

                }


                const uid =
                  currentUser.uid;


                console.log(
                  "OPENING ROOM:",
                  room.id,
                  "USER:",
                  uid
                );


                window.location.href =
                  "voice-room.html?room=" +
                  encodeURIComponent(
                    room.id
                  );

              }
            );


          roomsContainer.appendChild(
            div
          );

        }
      );

    }


    /* SEARCH */

    document
      .getElementById(
        "searchInput"
      )
      .addEventListener(
        "input",
        () => {

          const search =
            document
              .getElementById(
                "searchInput"
              )
              .value
              .toLowerCase()
              .trim();


          const filtered =
            allRooms.filter(
              (room) => {

                const name =
                  (
                    room.name ||
                    ""
                  ).toLowerCase();


                const host =
                  (
                    room.host ||
                    ""
                  ).toLowerCase();


                return (
                  name.includes(
                    search
                  ) ||
                  host.includes(
                    search
                  )
                );

              }
            );


          displayRooms(
            filtered
          );

        }
      );


    /* BOTTOM NAV */

    document
      .querySelectorAll(
        ".nav-item"
      )
      .forEach(
        (item) => {

          item.addEventListener(
            "click",
            () => {

              document
                .querySelectorAll(
                  ".nav-item"
                )
                .forEach(
                  (nav) => {
                    nav.classList.remove(
                      "active"
                    );
                  }
                );


              item.classList.add(
                "active"
              );

            }
          );

        }
      );


    /* START */

    loadRooms();

  </script>

</body>
</html>
