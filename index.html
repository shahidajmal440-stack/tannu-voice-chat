<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tannu Voice Chat</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      background: linear-gradient(145deg, #17102b, #241044, #0d1528);
      color: white;
    }

    .app {
      width: 100%;
      max-width: 430px;
      min-height: 100vh;
      margin: auto;
      padding: 18px;
    }

    .top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 22px;
    }

    .brand {
      font-size: 22px;
      font-weight: bold;
    }

    .profile {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: linear-gradient(135deg, #ff4da6, #8b5cf6);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
    }

    .welcome {
      text-align: left;
      margin-bottom: 20px;
    }

    .welcome h2 {
      font-size: 24px;
      margin-bottom: 6px;
    }

    .welcome p {
      color: #aaa4b8;
      font-size: 14px;
    }

    .search {
      width: 100%;
      padding: 13px 16px;
      border: 1px solid #3a3150;
      border-radius: 25px;
      background: #211936;
      color: white;
      outline: none;
      margin-bottom: 25px;
    }

    .section-title {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
    }

    .section-title h3 {
      font-size: 19px;
    }

    .rooms {
      display: grid;
      gap: 14px;
    }

    .room {
      background: linear-gradient(135deg, #292044, #1d1833);
      border: 1px solid #3b3155;
      border-radius: 18px;
      padding: 16px;
      text-align: left;
    }

    .room-top {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .room-avatar {
      width: 54px;
      height: 54px;
      border-radius: 16px;
      background: linear-gradient(135deg, #ff4da6, #8b5cf6);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      font-weight: bold;
    }

    .room-info {
      flex: 1;
    }

    .room-name {
      font-size: 17px;
      font-weight: bold;
      margin-bottom: 5px;
    }

    .room-host {
      color: #aaa4b8;
      font-size: 12px;
    }

    .live {
      background: #e83e75;
      padding: 5px 9px;
      border-radius: 12px;
      font-size: 10px;
      font-weight: bold;
    }

    .room-bottom {
      display: flex;
      justify-content: space-between;
      margin-top: 13px;
      color: #aaa4b8;
      font-size: 12px;
    }

    .join {
      margin-top: 13px;
      width: 100%;
      border: 0;
      padding: 11px;
      border-radius: 22px;
      background: linear-gradient(90deg, #ff4da6, #8b5cf6);
      color: white;
      font-weight: bold;
      cursor: pointer;
    }

    .loading {
      text-align: center;
      padding: 25px;
      color: #aaa4b8;
    }

    .empty {
      text-align: center;
      padding: 25px;
      color: #aaa4b8;
      background: #211936;
      border-radius: 18px;
    }

    .categories {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 9px;
      margin-top: 10px;
    }

    .category {
      background: #211936;
      border: 1px solid #3a3150;
      border-radius: 14px;
      padding: 12px 5px;
      font-size: 11px;
      text-align: center;
    }

    .bottom-space {
      height: 30px;
    }
  </style>
</head>

<body>

  <div class="app">

    <div class="top">
      <div class="brand">Tannu Voice Chat</div>
      <div class="profile">T</div>
    </div>

    <div class="welcome">
      <h2>Welcome 👋</h2>
      <p>Meet new friends and enjoy live voice rooms.</p>
    </div>

    <input
      class="search"
      type="text"
      placeholder="Search rooms..."
      oninput="searchRooms()"
      id="searchBox"
    >

    <div class="section-title">
      <h3>🔥 Popular Rooms</h3>
    </div>

    <div class="rooms" id="roomsList">
      <div class="loading">Loading rooms...</div>
    </div>

    <div class="section-title" style="margin-top:28px;">
      <h3>🎙️ Categories</h3>
    </div>

    <div class="categories">
      <div class="category">🔥 Popular</div>
      <div class="category">🎵 Music</div>
      <div class="category">💬 Chat</div>
      <div class="category">🎮 Games</div>
    </div>

    <div class="bottom-space"></div>

  </div>

  <script type="module">

    import { initializeApp }
      from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

    import {
      getFirestore,
      collection,
      getDocs
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAc7BBn6G5zzAmB4Mx-3haVwE0aob5HlVc",
      authDomain: "tannu-voice-chat.firebaseapp.com",
      projectId: "tannu-voice-chat",
      storageBucket: "tannu-voice-chat.firebasestorage.app",
      messagingSenderId: "720483733073",
      appId: "1:720483733073:web:c65b96d255d6177b9d7270"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    let allRooms = [];

    async function loadRooms() {

      const roomsList = document.getElementById("roomsList");

      try {

        const snapshot = await getDocs(
          collection(db, "rooms")
        );

        allRooms = [];

        snapshot.forEach((doc) => {

          const data = doc.data();

          allRooms.push({
            id: doc.id,
            name: data.name || "Unnamed Room",
            host: data.host || "Unknown",
            status: data.status || "offline",
            users: data.users || 0
          });

        });

        displayRooms(allRooms);

      } catch (error) {

        console.error(error);

        roomsList.innerHTML =
          '<div class="empty">Unable to load rooms.</div>';

      }
    }

    function displayRooms(rooms) {

      const roomsList =
        document.getElementById("roomsList");

      if (rooms.length === 0) {

        roomsList.innerHTML =
          '<div class="empty">No live rooms available.</div>';

        return;
      }

      roomsList.innerHTML = "";

      rooms.forEach((room) => {

        const roomElement =
          document.createElement("div");

        roomElement.className = "room";

        roomElement.innerHTML = `

          <div class="room-top">

            <div class="room-avatar">
              ${room.name.charAt(0).toUpperCase()}
            </div>

            <div class="room-info">

              <div class="room-name">
                ${room.name}
              </div>

              <div class="room-host">
                Host: ${room.host}
              </div>

            </div>

            <div class="live">
              ${room.status.toUpperCase()}
            </div>

          </div>

          <div class="room-bottom">

            <span>🎤 Voice Room</span>

            <span>
              👥 ${room.users} people
            </span>

          </div>

          <button
            class="join"
            onclick="joinRoom('${room.id}')">
            Join Room
          </button>

        `;

        roomsList.appendChild(roomElement);

      });
    }

    window.joinRoom = function(roomId) {

      window.location.href =
        "voice-room.html?room=" +
        encodeURIComponent(roomId);

    };

    window.searchRooms = function() {

      const input =
        document.getElementById("searchBox")
        .value
        .toLowerCase();

      const filtered =
        allRooms.filter(room =>
          room.name.toLowerCase().includes(input)
        );

      displayRooms(filtered);

    };

    loadRooms();

  </script>

</body>
</html>
